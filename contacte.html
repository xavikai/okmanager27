<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacte · Hoquei Manager 27</title><meta name="robots" content="noindex"><style>body{margin:0;background:#f3f5f8;color:#0f1722;font:16px/1.5 system-ui,sans-serif}main{max-width:560px;margin:40px auto;padding:24px;background:white;border:1px solid #e3e8ef;border-radius:16px}label{display:block;margin:18px 0 6px}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{width:100%;border:1px solid #d3dae4;border-radius:8px;padding:10px}button,a.button{display:inline-block;padding:10px 16px;border:0;border-radius:8px;background:#1f6feb;color:white;text-decoration:none;cursor:pointer}p.small{font-size:14px;color:#5f6b7b}@media(max-width:600px){main{margin:16px}}</style></head>
<body><main><a href="./">← Tornar al joc</a><h1>Contacte</h1><p>Explica’ns un problema amb el joc o demana corregir o retirar alguna dada d’un jugador o club.</p>
<form name="contacte-joc" method="POST" action="/api/contact">
<p hidden><label>No omplis aquest camp<input name="bot-field"></label></p>
<label for="nom">Nom (opcional)</label><input id="nom" name="nom" maxlength="100" autocomplete="name">
<label for="email">Correu per rebre resposta (opcional)</label><input id="email" name="email" type="email" maxlength="200" autocomplete="email">
<label for="missatge">Missatge</label><textarea id="missatge" name="missatge" rows="6" maxlength="4000" required></textarea>
<p class="small">El missatge es desa de manera privada a Cloudflare perquè el responsable del joc el pugui gestionar. No hi incloguis contrasenyes ni dades sensibles.</p><button type="submit">Enviar missatge</button></form></main></body></html>
