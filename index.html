<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hoquei Manager 27: fantasy d'hoquei patins gratuït i no oficial, amb un mode mànager.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1320">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</head>
<body>
<title>Hoquei Manager 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app esportiva actual — barra de club amb el color de l'equip, menú lateral (pestanyes a mòbil), targetes netes */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#f6f8fb; --line:#e3e8ef; --line2:#d3dae4;
  --fg:#0f1722; --dim:#5f6b7b; --accent:#1f6feb; --accent-fg:#ffffff; --data:#1f6feb;
  --good:#12a150; --bad:#e5484d; --warn:#d97706; --team:#1f6feb;
  --rink:#2a6fc0; --rinkline:#eaf2ff; --board:#0d1320; --boardfg:#f3f6fb;
  --shadow:0 1px 2px rgba(15,23,34,.06),0 4px 16px rgba(15,23,34,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --panel:#141a22; --panel2:#19212b; --line:#232c38; --line2:#2e3947;
  --fg:#e8edf4; --dim:#8b97a8; --accent:#4c8dff; --accent-fg:#06101f; --data:#6aa5ff;
  --good:#35c47a; --bad:#ff6b6e; --warn:#f0a43a; --rink:#1f5aa3; --rinkline:#d6e6ff; --board:#06090f; --boardfg:#f3f6fb;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --panel:#141a22; --panel2:#19212b; --line:#232c38; --line2:#2e3947;
  --fg:#e8edf4; --dim:#8b97a8; --accent:#4c8dff; --accent-fg:#06101f; --data:#6aa5ff;
  --good:#35c47a; --bad:#ff6b6e; --warn:#f0a43a; --rink:#1f5aa3; --rinkline:#d6e6ff; --board:#06090f; --boardfg:#f3f6fb;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font-family:inherit;font-size:15px;background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.wrap{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.bevel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2);border-color:var(--dim)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em;line-height:1.05}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:18px;text-transform:uppercase;color:var(--dim)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--accent)}.dat{color:var(--data)}

/* Start */
.start{display:grid;gap:18px}
.logo{position:relative;overflow:hidden;border-radius:18px;padding:34px 28px;background:var(--board);color:var(--boardfg);display:flex;flex-direction:column;gap:8px}
.logo::after{content:"";position:absolute;right:-60px;top:-60px;width:320px;height:320px;border-radius:50%;border:3px solid rgba(255,255,255,.12);box-shadow:0 0 0 46px rgba(255,255,255,.03)}
.logo .big{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(34px,6.6vw,64px);line-height:.88;text-transform:uppercase;letter-spacing:-.01em}
.logo .big em{color:#5aa2ff;font-style:italic}
.logo .sub{font-size:15px;opacity:.75;max-width:60ch}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.teamcard{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px}
.teamcard:hover{border-color:var(--accent)}
.teamcard .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.teamcard b{font-size:16px}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px}

/* Shell */
.top{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding:14px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--team)}
.top .club{display:flex;gap:12px;align-items:center;margin-right:auto;min-width:0}
.top .club b{font-family:var(--f-display);font-size:28px;line-height:1;text-transform:uppercase}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.shell{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
nav.menu{display:flex;flex-direction:column;gap:2px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
nav.menu button{text-align:left;background:transparent;border:0;border-radius:9px;padding:9px 12px;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:6px;color:var(--dim)}
nav.menu button:hover{background:var(--panel2);color:var(--fg)}
nav.menu button[aria-current="page"]{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 var(--accent)}
nav.menu .badge{background:var(--bad);color:#fff;font-size:11.5px;padding:0 7px;border-radius:10px;line-height:18px}
nav.menu .sep{height:1px;background:var(--line);margin:6px 8px}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.me td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
td.r,th.r{text-align:right}
.pos{display:inline-block;min-width:36px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.pos.POR{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pos.DEF{background:color-mix(in srgb,var(--data) 16%,transparent);color:var(--data)}
.pos.DAV{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.ovr{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.bar{width:56px;height:6px;background:var(--line);display:inline-block;vertical-align:middle;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
.tag.inj{background:var(--bad);color:#fff}
.xinj{display:inline-flex;align-items:center;gap:1px;color:#e0262f;font-weight:900;font-size:15px;line-height:1;vertical-align:-1px}.xinj small{font-size:10.5px;font-weight:700;color:var(--dim)}.tag.sale{background:var(--warn);color:#fff}
.zone-top td:first-child{box-shadow:inset 3px 0 var(--good)}
.zone-bot td:first-child{box-shadow:inset 3px 0 var(--bad)}

/* Next match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .side b{font-size:16px}
.vs .mid{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:30px;color:var(--dim)}
.news{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.news li{border-left:2px solid var(--line2);padding:2px 0 2px 12px}
.news li.hot{border-color:var(--accent)}

/* Rink */
.lineup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.rinkbox{position:relative;width:100%;max-width:290px;aspect-ratio:1/2;margin:0 auto}
.rinkbox>svg{position:absolute;inset:0;width:100%;height:100%}
.slot{cursor:grab;position:absolute;transform:translate(-50%,-50%);width:122px;max-width:44%;padding:7px 6px;text-align:center;background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px;align-items:center}
.slot.sel{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.slot.empty{border-style:dashed;opacity:.9}
.slot small{font-size:11.5px;opacity:.8}
/* Cromos */
.cardx{position:relative;width:180px;padding:12px 12px 10px;border-radius:16px 16px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#1d1405;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.28);flex:0 0 auto;isolation:isolate}
.cardx::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(150deg,#fff6c9 0%,#f0c94b 35%,#c99a1d 70%,#f7dc7a 100%)}
.cardx::after{content:"";position:absolute;inset:-40%;z-index:-1;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-60%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,70%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.cardx.silver{color:#1a1f26}.cardx.silver::before{background:linear-gradient(150deg,#ffffff 0%,#d5dbe3 40%,#9aa4b2 75%,#e8ecf1 100%)}
.cardx.bronze{color:#2b1608}.cardx.bronze::before{background:linear-gradient(150deg,#ffe0c2 0%,#d99a63 40%,#9a5a2a 75%,#e8b48a 100%)}
.cardx.leg{color:#fff}.cardx.leg::before{background:linear-gradient(150deg,#1c1033 0%,#3b1a6e 40%,#0f0a1f 70%,#6b3fb6 100%)}.cardx.leg .cx-st b,.cardx.leg .cx-ovr b{color:#ffd76a}
.cx-top{display:flex;width:100%;align-items:flex-start}
.cx-ovr{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:36px}.cx-ovr b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.9}.cx-ovr span{font-weight:800;font-size:13px;letter-spacing:.05em}
.cx-av{flex:1;display:flex;justify-content:center;margin-left:-14px}
.cx-av svg{border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)}
.cx-name{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1;border-top:1px solid currentColor;border-bottom:1px solid currentColor;border-color:rgba(0,0,0,.18);padding:3px 0;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-st{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.cx-st span{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.85}.cx-st b{font-size:16px;font-family:var(--f-display);line-height:1}
.cx-foot{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;max-width:100%}.cx-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardx.sm{width:142px;padding:10px 8px 8px}.cardx.sm .cx-ovr b{font-size:28px}.cardx.sm .cx-name{font-size:16px}.cardx.sm .cx-st b{font-size:14px}.cardx.sm .cx-st{gap:5px}
.cardx.click{cursor:pointer;transition:transform .15s}.cardx.click:hover{transform:translateY(-4px) rotate(-1deg)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:12px;justify-items:center}
.pmhead{display:flex;gap:16px;align-items:flex-start}.pmhead .attrs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pmhead .attr .bar{width:44px}@media (max-width:560px){.pmhead{flex-direction:column;align-items:center}}
/* Nivell */
.lvl{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;color:var(--fg)}
.lvn,.lvlbig{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:conic-gradient(#ffd400,#ff8a00,#ffd400);color:#1a1200;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:0 2px 8px rgba(255,170,0,.4)}
.lvt{display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:110px}.lvt i{display:block;height:5px;border-radius:3px;background:var(--line)}.lvt em{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ffd400,#ff8a00)}
.lvlbig{width:96px;height:96px;font-size:52px;margin:0 auto}.lvlbig.sm{width:64px;height:64px;font-size:34px;margin:0;flex:0 0 auto}
.xpbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 4px}.xpbar em{display:block;height:100%;background:linear-gradient(90deg,#ffd400,#ff8a00)}
/* Assoliments i vitrina */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:10px}
.ach{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);opacity:.55;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;border-color:#f2c200;background:linear-gradient(135deg,color-mix(in srgb,#ffd400 14%,var(--panel)),var(--panel))}
.ach .aic{grid-row:1/4;font-size:30px;line-height:1}.ach small{color:var(--dim);font-size:12px}.ach em{font-style:normal;font-size:11px;font-weight:700;color:#c98a00}
.cups{display:flex;gap:18px;flex-wrap:wrap}.cup{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}.cups.empty{align-items:center;opacity:.8}
.achpop{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;display:flex;gap:12px;align-items:center;background:#16120a;color:#fff;border:2px solid #f2c200;padding:10px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.achpop .aic{font-size:30px}.achpop small{display:block;color:#f2c200;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.achpop b{font-size:16px}.achpop.out{opacity:0;transition:opacity .5s}
@keyframes popin{from{transform:translate(-50%,-30px) scale(.8);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
/* Repte */
.chal{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,#36c5f0 16%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,#36c5f0 45%,var(--line))}
.chal .chic{font-size:28px}.chal div{display:flex;flex-direction:column;gap:1px}.chal small{color:var(--dim)}
/* Portada */
.hero{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:400/170;min-height:150px;background:#0b1020}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;color:#fff;text-align:center}
.hs{display:flex;flex-direction:column;align-items:center;gap:6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}.hs b{font-family:var(--f-display);font-size:clamp(14px,2.6vw,20px);text-transform:uppercase;line-height:1.05;text-shadow:0 2px 6px #000}
.hvs{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(28px,6vw,46px);color:#ffd400;text-shadow:0 3px 10px #000}
/* Celebracions */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:translateX(40px) rotate(720deg)}}
.goalfx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:92;background:radial-gradient(circle,color-mix(in srgb,var(--c1) 55%,transparent),transparent 70%);animation:gfade 1.5s ease forwards}
.gf-in{display:flex;flex-direction:column;align-items:center;transform:scale(.4);animation:gzoom 1.5s cubic-bezier(.2,1.5,.4,1) forwards}
.gf-in b{font-family:var(--f-display);font-weight:900;font-style:italic;font-size:clamp(70px,16vw,150px);line-height:.9;color:#fff;-webkit-text-stroke:3px var(--c1);text-shadow:0 6px 0 var(--c2),0 10px 30px rgba(0,0,0,.5)}
.gf-in span{font-family:var(--f-display);font-size:clamp(20px,4vw,32px);font-weight:800;color:#fff;text-shadow:0 2px 8px #000;text-transform:uppercase}.gf-in small{color:#fff;text-shadow:0 2px 6px #000;font-weight:700}
@keyframes gzoom{0%{transform:scale(.4)}25%{transform:scale(1.08)}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes gfade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.celeb .box{max-width:420px}.celeb h2{margin:0}
.postm{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;padding:6px 0 10px}
.pm-res{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:14px;background:var(--panel2);min-width:170px;text-align:center}
.pm-res b{font-family:var(--f-display);font-weight:800;font-size:58px;line-height:1}.pm-res.w{background:color-mix(in srgb,var(--good) 18%,var(--panel))}.pm-res.l{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.pm-mvp{display:flex;flex-direction:column;align-items:center;gap:6px}
@media (max-width:820px){.top .lvl{order:2}.lvt{min-width:0}}
@media (prefers-reduced-motion:reduce){.cardx::after{animation:none;display:none}}
.slot.tok{width:auto;max-width:none;background:none;border:0;box-shadow:none;padding:0;gap:3px;color:#fff;cursor:grab}
.slot.tok .disc{width:44px;height:44px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.4);display:grid;place-items:center;position:relative;background:repeating-linear-gradient(90deg,var(--c1) 0 7px,var(--c2) 7px 14px)}
.slot.tok .disc b{font-size:16px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;position:relative;line-height:1}
.slot.tok .disc.gk{background:none;border:0}.slot.tok .disc.gk svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}.slot.tok .disc.gk b{font-size:11px;align-self:end;margin-bottom:-6px;background:rgba(12,16,24,.85);border-radius:6px;padding:1px 4px}
.slot.tok .disc.empty{background:rgba(255,255,255,.18);border:2px dashed #fff;color:#fff;font-size:22px;font-weight:700;box-shadow:none}

function makeFixtures(ids,seed){

  for(let k=0;k<n-1;k++){const m=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((k+i)%2)[h,a]=[a,h];m.push({h,a,res:null})}rounds.push(m);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const back=rounds.map(rd=>rd.map(m=>({h:m.a,a:m.h,res:null})));
  return rounds.concat(back);
}

}
function lineupOf(tid){

/* ============ SIMULADOR DE PARTIT ============ */
function strength(tid,home){
  const t=S.teams[tid],L=lineupOf(tid).map(id=>S.players[id]);
  const gk=L.find(p=>p.pos==="POR")||L[0];const f=L.filter(p=>p!==gk);
  const cond=p=>(.9+.1*p.energy/100)*(.94+.12*p.morale/100)*(p.issue?.94:1);
  let att=f.reduce((s,p)=>s+atkR(p)*cond(p),0)/Math.max(1,f.length);
  let def=f.reduce((s,p)=>s+defR(p)*cond(p),0)/Math.max(1,f.length);
  let g=ovr(gk)*cond(gk);const CA=coachOf(tid,"ass"),CG=coachOf(tid,"gk");if(CG)g*=1+(CG.gk-70)/800;
  const st=t.tactic.style,pr=t.tactic.press;
  if(st==="ATA"){att*=1.05;def*=.95}else if(st==="DEF"){att*=.95;def*=1.05}
  if(pr==="ALT"){att*=1.025;def*=1.015}else if(pr==="BAI"){att*=.985}
  if(home)att*=1.035;
  if(CA){att*=1+(CA.tac-70)/800;def*=1+(CA.tac-70)/800}
  return {att,def,g,L,gk,f};
}
function applyResult(m){

    if(e.t==="goal"){p.goals++;if(e.type==="penal")p.pg=(p.pg||0)+1;if(e.type==="falta directa")p.fdg=(p.fdg||0)+1;if(e.as&&S.players[e.as])S.players[e.as].ast=(S.players[e.as].ast||0)+1}
    if(e.t==="pensave"&&S.players[e.gk])S.players[e.gk].psave=(S.players[e.gk].psave||0)+1;
    if(e.t==="red")p.reds=(p.reds||0)+1;
    if(e.t==="blue")p.cards++;if(e.t==="inj"){const C=clubOf(e.tid);if(C)e.w=Math.max(1,e.w-C.staff.fisio);p.inj=Math.max(p.inj,e.w+1)}}
  const played=new Set([...r.lh,...r.la]);
  for(const [ids,conc] of [[r.lh,r.ga],[r.la,r.gh]]){const gk=ids.map(id=>S.players[id]).find(p=>p&&p.pos==="POR");if(gk){gk.gkApps=(gk.gkApps||0)+1;gk.gc=(gk.gc||0)+conc;if(!conc)gk.cs=(gk.cs||0)+1}}

      else p.energy=clamp(p.energy+20+(CL?CL.staff.prep*4+CL.fac.gimnas*5:0),0,100);
      const win=(tid===m.h?r.gh>r.ga:r.ga>r.gh),lose=(tid===m.h?r.gh<r.ga:r.ga<r.gh);
      p.morale=clamp(p.morale+(win?5:lose?-5:0),20,100);
    }
  }
}

/* ============ JORNADA ============ */
function autoFix(tid){const L=S.teams[tid].lineup;if(L.some(id=>!id||!S.players[id]||S.players[id].team!==tid||!avail(S.players[id])))autoLineup(tid)}
function finances(rd){
  for(const tid in S.teams){

    if(!t.inc)t.inc=Math.round((salaryMass(tid)*1.02+t.rep*2)*10)/10;const base=t.inc/26,tickets=home?Math.round(base*.9*(.85+R()*.3)*10)/10:0,spons=Math.round((base*.55+(won?t.rep*.15:0))*10)/10,sal=Math.round(salaryMass(tid)/26*10)/10;

/* ============ CLASSIFICACIÓ ============ */
function table(div){
  div=div||myDiv();const T={};for(const id in S.teams)if(divOf(id)===div)T[id]={id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,last:[]};
  for(const rd of FX(div))for(const m of rd){if(!T[m.h]||!T[m.a])continue;if(!m.res)continue;const h=T[m.h],a=T[m.a],x=m.res.gh,y=m.res.ga;
    h.pj++;a.pj++;h.gf+=x;h.gc+=y;a.gf+=y;a.gc+=x;
    if(x>y){h.g++;a.p++;h.pts+=3;h.last.push("V");a.last.push("D")}else if(x<y){a.g++;h.p++;a.pts+=3;h.last.push("D");a.last.push("V")}else{h.e++;a.e++;h.pts++;a.pts++;h.last.push("E");a.last.push("E")}}
  return Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
}
function endSeason(){

    if(d!==myDiv())pushNews(`${DIVS[d]}${_tx(`: campió `)}${S.teams[t2[0].id].name}.`)}

}
/* Ascensos i descensos: el campió de cada grup de Plata (que no sigui filial) puja; els dos últims de l'OK Liga baixen */
function seasonMoves(){

  const up=["PN","PS"].map(g=>{const t=table(g).find(r=>!S.teams[r.id].filial);return t&&t.id}).filter(Boolean);

  if(M.up.includes(S.user)){unlock("asc");board().conf=clamp(board().conf+25,0,100);pushNews(W(_tx("Comença una nova etapa a l'OK Liga!"),_tx("¡Empieza una nueva etapa en la OK Liga!")),true)}

}

/* ============ MERCAT ============
   Finestres: estiu (abans de la J1 i entre temporades) i Nadal (després de la J13).
   Fora de finestra es poden tancar acords, però el jugador no s'incorpora fins a la finestra següent. */
const WINTER=13,JOBS=3;
const mktOpen=()=>true; // el mercat és sempre obert: els fitxatges s'incorporen a l'instant
const nextWin=()=>S.finished||S.round>WINTER?_tx("l'estiu"):"Nadal";
const winLabel=()=>S.finished||S.round===0?_tx("Mercat d'estiu obert"):S.round===WINTER?_tx("Mercat de Nadal obert"):`${_tx(`Mercat tancat · els acords es fan efectius per `)}${nextWin()==="Nadal"?_tx("Nadal (després de la J")+WINTER+")":_tx("l'estiu")}`;
const PERKS=[
 {k:"feina",l:_tx("Feina en una empresa col·laboradora"),cost:0,d:_tx("Sense cost, però el club només en té ")+JOBS},
 {k:"pis",l:_tx("Pis pagat a la ciutat"),cost:4.5,d:_tx("≈450 €/mes")},
 {k:"cotxe",l:_tx("Cotxe del patrocinador"),cost:1.5,d:_tx("≈150 €/mes")},
 {k:"estudis",l:_tx("Estudis pagats"),cost:2,d:_tx("≈200 €/mes")},
 {k:"titular",l:_tx("Promesa de titularitat"),cost:0,d:_tx("Si no juga de titular, perdrà moral")}];
const perkCost=p=>p.perks?PERKS.reduce((s,x)=>s+(p.perks[x.k]?x.cost:0),0):0;
const jobsUsed=tid=>squad(tid).filter(p=>p.perks&&p.perks.feina).length+(S.pending||[]).filter(x=>x.to===tid&&x.deal&&x.deal.perks.feina).length;
function isKey(p){const sq=squad(p.team).sort((a,b)=>ovr(b)-ovr(a));return sq.indexOf(p)<3}
function canLeave(p){if(divOf(p.team)==="INT")return null;const sq=squad(p.team);if(sq.length<=8)return _tx("L'equip no té prou jugadors per vendre'l.");if(p.pos==="POR"&&sq.filter(x=>x.pos==="POR").length<=2)return _tx("No vendran un dels seus dos porters.");return null}
const pend=()=>S.pending||(S.pending=[]);
const incoming=tid=>pend().filter(x=>x.to===tid).length;
const outgoing=tid=>pend().filter(x=>x.from===tid).length;
const committed=tid=>pend().filter(x=>x.to===tid).reduce((s,x)=>s+x.fee,0);
/* Què valora cada jugador: perfil fix a partir del nom, l'edat i la seva situació */
function prefs(p,to){
  const r=rng(hash(p.name+"|pref")),cur=monthlyOf(p),me=S.teams[to],from=S.teams[p.team];
  const starter=from.lineup.includes(p.id);
  const w=()=>.5+r();
  const v={
    feina:Math.round(clamp(950-cur*.45,80,950)*w()*(p.age<20?.5:1)),
    pis:Math.round((me.city===from.city?80:380+r()*300)),
    cotxe:Math.round(80+r()*170),
    estudis:Math.round(p.age<=21?350+r()*350:p.age<=25?150+r()*250:p.age<=29?r()*120:0),
    titular:Math.round(starter?60+r()*120:350+r()*450),
  };
  const arrel=Math.round(r()*450*(p.age>=28?1.4:1));
  return {v,arrel};
}
function prefHint(p,to){const {v}=prefs(p,to);const L={feina:_tx("tenir feina a la ciutat"),pis:_tx("un pis pagat"),cotxe:_tx("un cotxe"),estudis:_tx("poder estudiar"),titular:_tx("tenir minuts de titular")};
  return Object.entries(v).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>L[k]).join(W(" i "," y "))}
/* Utilitat de l'oferta en €/mes equivalents */
function evalDeal(p,to,deal){
  const {v,arrel}=prefs(p,to),cur=monthlyOf(p);
  let U=deal.sal*1000/10;
  for(const k in v)if(deal.perks[k])U+=v[k];
  U+=(S.teams[to].rep-S.teams[p.team].rep)*140;
  const y=deal.years;U+=p.age>=29?(y-1)*110:p.age<=23&&y>3?-(y-3)*90:y>=2?60:0;
  const need=Math.max(cur*1.12,cur+150)+arrel;
  return {U,need,ratio:U/Math.max(need,1)};
}
function feeOk(p,fee){
  let v=valueOf(p)*(isKey(p)?1.35:1);if(p.contract<=S.season+1)v*=.6;
  const ratio=fee/v;const prob=ratio>=1.25?1:ratio>=1?.6+(ratio-1)*1.6:ratio>=.85?.15:0;
  return {v,ratio,ok:R()<prob};
}
function makeOffer(pid,deal){
  const p=S.players[pid],me=S.teams[S.user],from=S.teams[p.team];
  if(!sameG(p.team,S.user))return {ok:false,msg:W(_tx("Aquesta jugadora juga en una altra competició."),_tx("Esta jugadora juega en otra competición."))};
  if(p.talked===S.season*100+S.round)return {ok:false,msg:`${_tx(`Ja has parlat amb `)}${p.name}${_tx(` aquesta jornada. Torna-ho a provar després del proper partit.`)}`};
  if(pend().some(x=>x.pid===pid))return {ok:false,msg:`${p.name}${_tx(` ja té un acord tancat amb un club.`)}`};
  if(squad(S.user).length+incoming(S.user)>=12)return {ok:false,msg:_tx("Entre la plantilla i els fitxatges pendents ja tens 12 jugadors.")};
  if(deal.fee+committed(S.user)>me.budget)return {ok:false,msg:_tx("No tens prou pressupost (compta també els fitxatges pendents de pagar).")};
  if(deal.perks.feina&&jobsUsed(S.user)>=JOBS)return {ok:false,msg:`${_tx(`Les `)}${JOBS}${_tx(` feines de les empreses col·laboradores ja estan donades.`)}`};
  const no=canLeave(p);if(no)return {ok:false,msg:no};
  p.talked=S.season*100+S.round;
  const c=feeOk(p,deal.fee);
  if(!c.ok){save();return {ok:false,msg:c.ratio<.85?`${_tx(`El `)}${from.name}${_tx(` ni s'ho planteja. Valoren `)}${p.name}${_tx(` en uns `)}${money(Math.round(c.v))}.`:`${_tx(`El `)}${from.name}${_tx(` rebutja el traspàs. Potser amb una mica més…`)}`}}
  const e=evalDeal(p,S.user,deal);
  const yes=e.ratio>=1||(e.ratio>=.92&&R()<.4);
  if(!yes){save();const gap=Math.round((e.need-e.U)/10)*10;
    return {ok:false,msg:`${_tx(`El `)}${from.name}${_tx(` accepta el traspàs, però `)}${p.name}${_tx(` diu que no. `)}${e.ratio<.75?_tx("La proposta queda molt lluny del que vol."):_tx("S'hi acosta: li falten uns ")+gap.toLocaleString("ca-ES")+_tx(" €/mes en sou o en condicions.")}${_tx(` Li importa sobretot `)}${prefHint(p,S.user)}.`}}
  if(mktOpen()){doTransfer({pid,from:p.team,to:S.user,fee:deal.fee,deal});save();return {ok:true,msg:`${p.name}${_tx(` és nou jugador del `)}${me.name}!`}}
  pend().push({id:"t"+(S.nextId++),pid,from:p.team,to:S.user,fee:deal.fee,deal});
  pushNews(`${_tx(`ACORD: `)}${p.name} (${from.name}${_tx(`) jugarà al `)}${me.name}${_tx(` a partir de `)}${nextWin()==="Nadal"?"Nadal":_tx("l'estiu")}${_tx(`. Traspàs de `)}${money(deal.fee)}${_tx(`, que es pagarà quan s'incorpori.`)}`,true);save();
  return {ok:true,msg:`${_tx(`Acord tancat! `)}${p.name}${_tx(` s'incorporarà per `)}${nextWin()==="Nadal"?"Nadal":_tx("l'estiu")}.`};
}
function doTransfer(x){
  const p=S.players[x.pid],from=S.teams[x.from],to=S.teams[x.to];
  if(x.to===S.user&&ovr(p)>=88)setTimeout(()=>{unlock("star");save()},50);
  from.budget+=x.fee;to.budget-=x.fee;p.team=x.to;p.forSale=false;p.morale=80;p.leaving=false;
  if(x.deal){p.salary=x.deal.sal;p.perks={...x.deal.perks};p.contract=S.season+x.deal.years}
  else p.perks=null;
  from.lineup=from.lineup.filter(id=>id!==p.id);autoLineup(from.id);autoLineup(to.id);
  const extra=x.deal?Object.keys(x.deal.perks).filter(k=>x.deal.perks[k]).map(k=>({feina:W("feina","trabajo"),pis:W("pis","piso"),cotxe:W("cotxe","coche"),estudis:W("estudis","estudios"),titular:W("titularitat","titularidad")})[k]):[];
  pushNews(`${x.to===S.user?_tx("FITXATGE"):x.from===S.user?_tx("VENDA"):_tx("MERCAT")}: ${p.name}${_tx(` passa del `)}${from.name}${_tx(` al `)}${to.name}${_tx(` per `)}${money(x.fee)}${extra.length?_tx(" (amb ")+extra.join(", ")+")":""}.`,x.to===S.user||x.from===S.user);
}
/* Quan s'obre una finestra, s'executen els acords pendents i els altres clubs també es mouen */
function openWindow(){
  const list=pend().slice();S.pending=[];
  for(const x of list){const p=S.players[x.pid],to=S.teams[x.to];
    if(!p||p.team!==x.from){continue}
    if(to.budget<x.fee||squad(x.to).length>=12||squad(x.from).length<=8){p.leaving=false;pushNews(`${_tx(`S'ha caigut el traspàs de `)}${p.name}${_tx(` al `)}${to.name}.`,x.to===S.user||x.from===S.user);continue}
    doTransfer(x);

}
function aiMarket(){
  const ai=Object.keys(S.teams).filter(t=>t!==S.user&&divOf(t)!=="INT");

function clubRound(m,home,won,lost,t,base){

  C.form=clamp(C.form*.6+(won?1:lost?-1:0),-3,3);

  // obres en curs
  for(const w of C.works){w.left--;if(w.left<=0){C.fac[w.k]++;if(w.k==="marcador")C.afi=clamp(C.afi+5,20,100);pushNews(`${_tx(`OBRES: ja s'ha acabat «`)}${OBRES[w.k].l}»${OBRES[w.k].max>1?_tx(" (fase ")+C.fac[w.k]+")":""}.`,true)}}
  C.works=C.works.filter(w=>w.left>0);
  const capNow=Math.round(CAP[t.rep-1]*(1+.25*C.fac.grades)*(C.works.some(w=>w.k==="grades")?.8:1));
  if(home){
    const opp=S.teams[m.h===S.user?m.a:m.h];
    const fill=clamp(.3+C.afi/200+C.form*.04+(opp.rep>=5?.15:opp.rep>=4?.07:0)+(R()-.5)*.1,.2,1);
    r.att=Math.round(capNow*fill);C.lastAtt=r.att;

    const bp=BARP[C.bar.price];let serv=C.bar.staff==="pro"?1:.85;
    if(C.bar.staff==="vol"&&R()<.08){serv=.5;pushNews(_tx("Al bar falten voluntaris: cues llarguíssimes a la mitja part."))}
    const lvl=[.8,1,1.3][C.fac.bar];
    r.bar=Math.round(r.att*bp.rate*bp.spend*.6*serv*lvl/1000*10)/10;
    if(C.bar.staff==="pro")r.staff+=.12;
    C.afi=clamp(C.afi+bp.afi,20,100);
    // panera: venda de números al pavelló
    if(C.panera&&!C.panera.done){const P=C.panera;const n=Math.round(r.att*.11*PANERA.mida[P.mida].att*PANERA.preu[P.preu].el*(P.players?1.5:1)*(.85+R()*.3));P.sold+=n}
    // avaries puntuals

      r.inc-=cost;pushNews(`${_tx(`IMPREVIST: `)}${[_tx("goteres al sostre del pavelló"),_tx("s'ha espatllat la calefacció dels vestidors"),_tx("una part de la tanca de la pista està malmesa"),_tx("el marcador ha deixat de funcionar a mig partit")][k]}${_tx(`. Reparació: `)}${money(cost)}.`,true)}
  }

  if(C.panera&&!C.panera.done){const P=C.panera;P.sold+=Math.round(35*PANERA.mida[P.mida].att*PANERA.preu[P.preu].el*(P.players?1.4:1)*(.8+R()*.4));
    if(P.players)for(const p of squad(S.user))p.morale=clamp(p.morale-1,20,100)}

  r.staff+=coachCost();
  r.staff=Math.round(r.staff*100)/100;
  r.extra=Math.round((r.inc+C.oneoff)*10)/10;C.oneoff=0;
  return r;
}

function aiPoach(){
  if(R()>.14)return;
  const mine=squad(S.user).filter(p=>!p.forSale&&!p.leaving&&!S.offers.some(o=>o.pid===p.id)&&p.age>=18).sort((a,b)=>ovr(b)-ovr(a)).slice(0,6);
  if(!mine.length)return;const p=mine[ri(0,mine.length-1)];
  const v=valueOf(p),buyers=Object.keys(S.teams).filter(t=>t!==S.user&&sameG(t,S.user)&&divOf(t)!=="INT"&&S.teams[t].budget>v*1.1&&squad(t).length+incoming(t)<12);
  if(!buyers.length)return;const b=buyers[ri(0,buyers.length-1)],B=S.teams[b];
  const amt=Math.round(v*(1+R()*.4)*10)/10;
  const keen=B.rep>S.teams[S.user].rep||p.morale<50||(B.rep===S.teams[S.user].rep&&R()<.45)||R()<.15;
  S.offers.push({id:"o"+(S.nextId++),pid:p.id,from:b,amt,unsol:true,keen,talked:false});
  pushNews(`${_tx(`AVÍS: el `)}${B.name}${_tx(` ha fet una oferta de `)}${money(amt)}${_tx(` per `)}${p.name}. ${keen?_tx(`El jugador està temptat d'anar-hi.`):`${_tx(`Sembla que `)}${p.name}${_tx(` no en té ganes.`)}`}`,true);
}
function loyalty(p){return (hash(p.name+"|loy")%100)/100}
function convince(oid,how){
  const o=S.offers.find(x=>x.id===oid);if(!o||o.talked)return;const p=S.players[o.pid];o.talked=true;
  let ok=false,msg="";
  if(how==="talk"){ok=R()<.3+loyalty(p)*.35+(p.morale-50)/250;msg=ok?`${p.name}${_tx(`: «D'acord, míster, em quedo. Aquí estic bé.»`)}`:`${p.name}${_tx(` t'escolta, però encara vol marxar.`)}`}
  if(how==="pay"){const ns=Math.round(p.salary*1.2*100)/100;ok=R()<.85;if(ok){p.salary=ns;msg=`${p.name}${_tx(` accepta l'augment (`)}${eurMes(p)}${_tx(`) i es queda.`)}`}else msg=`${p.name}${_tx(` diu que no és qüestió de diners.`)}`}
  if(how==="promise"){ok=R()<.7;if(ok){p.perks={...(p.perks||{}),titular:true};msg=`${p.name}${_tx(` es queda amb la promesa de jugar de titular. Compleix-la!`)}`}else msg=`${p.name}${_tx(` no s'ho creu: ja li havien promès abans.`)}`}
  if(ok){S.offers=S.offers.filter(x=>x.id!==oid);p.morale=clamp(p.morale+8,20,100);pushNews(`${_tx(`RENOVACIÓ DE COMPROMÍS: `)}${msg}`,true)}
  else{p.morale=clamp(p.morale-6,20,100);pushNews(msg,true)}
  sfx(ok?"ok":"no");toast(msg);save();render();
}

/* ============ PARTIT PER PARTS ============
   Cada part es simula amb l'alineació i la tàctica del moment. El partit de l'usuari s'atura al descans
   per fer canvis, ajustar la tàctica i fer la xerrada al vestidor. */
const RITME={PAU:.85,NOR:1,RAP:1.15};
function tac(tid){const t=S.teams[tid].tactic;t.ritme=t.ritme||"NOR";t.marca=t.marca||"ZON";return t}
function shooterOf(tid,s){const t=tac(tid);const p=t.shooter&&s.f.find(x=>x.id===t.shooter);return p||s.f.slice().sort((a,b)=>b.a.xut-a.a.xut)[0]}
function simHalf(h,a,half,ev){return simSeg(h,a,half===1?1:26,half===1?25:50,ev)}
function simSeg(h,a,m0,m1,ev){const half=m0>25?2:1,fr=(m1-m0+1)/25;
  const H=strength(h,true),A=strength(a,false),TH=tac(h),TA=tac(a);
  for(const [S_,T,O] of [[H,TH,TA],[A,TA,TH]]){
    if(T.marca==="IND")S_.def*=1.03;else if(T.marca==="MIX")S_.def*=1.012;
    if(T.ritme==="RAP"){S_.att*=1.015;S_.def*=.985}
    const talk=T.talk;if(half===2&&talk==="exig"){S_.att*=1.03;S_.def*=.99}else if(half===2&&talk==="calma"){S_.def*=1.03;S_.att*=.99}
  }
  const pc=Math.sqrt(RITME[TH.ritme]*RITME[TA.ritme]);
  const lam=(x,y)=>clamp(2.5*Math.pow(x.att/(y.def*.55+y.g*.45),4.2),.3,8)*.43*pc*fr;
  const mm=()=>ri(m0,m1);
  const best=s=>s.f.slice().sort((x,y)=>atkR(y)-atkR(x))[0];
  const scorer=(s,oppT)=>{const b=best(s);return pickW(s.f,s.f.map(p=>Math.pow(p.a.xut,2)*(p.pos==="DAV"?1.5:1)*(oppT.marca==="MIX"&&p===b?.45:1)))};
  let gh=poisson(lam(H,A)),ga=poisson(lam(A,H));
  const assist=(s,sc)=>{if(R()>.62)return null;const o=s.f.filter(p=>p!==sc);return o.length?pickW(o,o.map(p=>p.a.tec*p.a.tec)).id:null};
  for(let i=0;i<gh;i++){const sc=scorer(H,TA);ev.push({m:mm(),t:"goal",tid:h,pid:sc.id,type:"jugada",as:assist(H,sc)})}
  for(let i=0;i<ga;i++){const sc=scorer(A,TH);ev.push({m:mm(),t:"goal",tid:a,pid:sc.id,type:"jugada",as:assist(A,sc)})}
  const extra=[0,0];
  [[H,h,A,TH,TA,0],[A,a,H,TA,TH,1]].forEach(([s,tid,o,T,OT,k])=>{
    const nb=poisson(fr*.45*(T.marca==="IND"?1.4:1)*(T.ritme==="RAP"?1.1:1));for(let i=0;i<nb;i++){const p=s.f[ri(0,s.f.length-1)];ev.push({m:mm(),t:"blue",tid,pid:p.id})}
    // faltes directes i penals: com més blaves i marcatge individual del rival, més n'hi ha
    const na=poisson(fr*.32*(OT.marca==="IND"?1.35:1));
    for(let i=0;i<na;i++){const sh=shooterOf(tid,s);const pen=R()<.45;
      const pr=clamp(.3+(sh.a.xut-ovr(o.gk))/90+(pen?.1:0)+(sh.a.tec-80)/300,.12,.7);
      if(R()<pr){extra[k]++;ev.push({m:mm(),t:"goal",tid,pid:sh.id,type:pen?"penal":"falta directa"})}
      else ev.push({m:mm(),t:pen?"pensave":"fdmiss",tid,pid:sh.id,gk:o.gk.id})}
    if(R()<.022*fr*(T.marca==="IND"?1.5:1)){const p=s.f[ri(0,s.f.length-1)];ev.push({m:mm(),t:"red",tid,pid:p.id,n:R()<.7?1:2})}
    if(R()<.045*fr*injMul(tid)){const p=s.L[ri(0,s.L.length-1)];ev.push({m:mm(),t:"inj",tid,pid:p.id,w:ri(1,4)})}
  });
  return [gh+extra[0],ga+extra[1],H.L.map(p=>p.id),A.L.map(p=>p.id)];
}
function simMatch(h,a){
  const ev=[];const [a1,b1,lh1,la1]=simHalf(h,a,1,ev);
  for(const e of ev)if(e.t==="inj"){const p=S.players[e.pid];if(p)p.inj=Math.max(p.inj,1)}
  autoFix(h);autoFix(a);
  const [a2,b2,lh2,la2]=simHalf(h,a,2,ev);
  ev.sort((x,y)=>x.m-y.m);
  return {gh:a1+a2,ga:b1+b2,ev,lh:[...new Set([...lh1,...lh2])],la:[...new Set([...la1,...la2])]};
}
function aiTactic(tid){const t=tac(tid);const o=teamOvr(tid);t.style=o>=81?"ATA":o<=74?"DEF":"EQU";t.press=R()<.3?"ALT":"MIG";
  t.ritme=o<=74?(R()<.6?"PAU":"NOR"):o>=82&&R()<.4?"RAP":"NOR";t.marca=["ZON","ZON","IND","MIX"][ri(0,3)];t.talk=null;t.shooter=null}
function aiHalftime(tid,diff){const t=tac(tid);if(diff<=-2){t.style="ATA";t.ritme="RAP";t.talk="exig"}else if(diff>=2){t.style="DEF";t.ritme="PAU";t.talk="calma"}}

/* ============ ENTRENAMENT ============
   Cada jornada els jugadors entrenen segons el pla: intensitat, enfocament de grup i plans individuals.
   L'entrenament fa pujar les mitjanes (més als joves), però l'entrenament dur cansa i pot lesionar. */
const TFOCUS={
 fis:{l:_tx("Físic"),k:["fis","pat"]},tec:{l:_tx("Tècnica i estic"),k:["tec","pat"]},xut:{l:_tx("Xut i faltes directes"),k:["xut","tec"]},
 def:{l:_tx("Defensa"),k:["def","fis"]},equ:{l:_tx("Equilibrat"),k:["pat","tec","xut","def","fis"]}};
const TINT={suau:{l:_tx("Suau"),g:.55,e:8,inj:0},normal:{l:_tx("Normal"),g:1,e:0,inj:.004},dur:{l:_tx("Dur"),g:1.7,e:-8,inj:.016}};
const IATTR={pat:_tx("Patinatge"),tec:_tx("Tècnica"),xut:_tx("Xut"),def:_tx("Defensa"),fis:_tx("Físic"),ref:_tx("Reflexos"),col:_tx("Col·locació")};
function trainPlan(){if(!S.train)S.train={int:"normal",focus:"equ",ind:{},log:[]};return S.train}
function trainRound(){
  const T=trainPlan(),I=TINT[T.int],C=S.club,prep=C?C.staff.prep:0,gym=C?C.fac.gimnas:0;
  for(const p of squad(S.user)){
    if(!avail(p))continue;
    p.energy=clamp(p.energy+I.e,30,100);
    if(R()<I.inj*(gym?.7:1)){const w=ri(1,2);p.inj=Math.max(p.inj,w+1);pushNews(W(`${p.name}${_tx(` s'ha lesionat entrenant. Baixa de `)}${w}${_tx(` setm.`)}`,`${p.name}${_tx(` se ha lesionado entrenando. Baja de `)}${w}${_tx(` sem.`)}`),true);continue}
    const age=p.age<=21?1.7:p.age<=25?1.25:p.age<=29?.85:p.age<=32?.5:.25;
    const gk=p.pos==="POR",ind=T.ind[p.id];
    const keys=gk?["ref","col","pat"]:TFOCUS[T.focus].k;
    const CGk=coachOf(S.user,"gk"),CY=coachOf(S.user,"youth");const cm=(gk&&CGk?1+(CGk.gk-70)/60:1)*(p.age<=23&&CY?1+(CY.you-70)/50:1);
    const tries=[[keys[ri(0,keys.length-1)],.15*cm],[keys[ri(0,keys.length-1)],.15*cm]];if(ind)tries.push([ind,.3*cm]);
    for(const [k,base] of tries){const cur=p.a[k];const cap=cur>=92?.3:cur>=86?.6:1;
      const ch=base*I.g*age*cap*(1+.15*prep+(k==="fis"?.2*prep:0));
      if(R()<ch){const o=ovr(p);p.a[k]=clamp(cur+1,20,99);if(ovr(p)>o){T.log.unshift({r:S.round,pid:p.id,k,v:ovr(p)});T.log=T.log.slice(0,30)}}}
  }
}

/* ============ ESTADÍSTIQUES DEL PARTIT I RESUM DE LA JORNADA ============ */
function matchStats(m){
  const r=m.res;if(!r||r.stats)return;
  const cnt=(tid,t,f)=>r.ev.filter(e=>e.tid===tid&&e.t===t&&(!f||f(e))).length;
  const oh=teamOvr(m.h),oa=teamOvr(m.a);
  const ph=clamp(Math.round(50+(oh-oa)*1.3+2+(R()-.5)*10),32,68);
  const st={poss:[ph,100-ph]};
  st.shots=[m.h,m.a].map((tid,k)=>{const g=k?r.ga:r.gh;return Math.max(g+6,Math.round(17+(st.poss[k]-50)*.45+g*1.6+(R()-.5)*8))});
  st.ont=[m.h,m.a].map((tid,k)=>{const g=k?r.ga:r.gh;return Math.min(st.shots[k],g+ri(4,9))});
  st.blue=[m.h,m.a].map(t=>cnt(t,"blue"));
  st.fd=[m.h,m.a].map(t=>[cnt(t,"goal",e=>e.type==="falta directa"),cnt(t,"goal",e=>e.type==="falta directa")+cnt(t,"fdmiss")]);
  st.pen=[m.h,m.a].map(t=>[cnt(t,"goal",e=>e.type==="penal"),cnt(t,"goal",e=>e.type==="penal")+cnt(t,"pensave")]);
  r.stats=st;
}
function scorersOf(m,tid){const c={};for(const e of m.res.ev)if(e.t==="goal"&&e.tid===tid){const p=S.players[e.pid];if(p)c[p.name]=(c[p.name]||0)+1}

   ${row(W(_tx("Faltes directes (gol/intents)"),_tx("Faltas directas (gol/intentos)")),st.fd[0].join("/"),st.fd[1].join("/"))}${row(W(_tx("Penals (gol/intents)"),_tx("Penaltis (gol/intentos)")),st.pen[0].join("/"),st.pen[1].join("/"))}${row(W(_tx("Targetes blaves"),_tx("Tarjetas azules")),st.blue[0],st.blue[1])}</tbody></table>
   ${mine.length?`<p style="margin:0;font-size:13.5px"><span class="lbl">${W(_tx("Notes dels teus jugadors"),_tx("Notas de tus jugadores"))}</span><br>${mine.map(([id,v])=>`${esc(S.players[id].name)}${_tx(` <b class="num" style="color:`)}${v>=7.5?"var(--good)":v<=5?"var(--bad)":"inherit"}">${v.toLocaleString("ca-ES")}</b>`).join(" · ")}</p>`:""}
   <p class="muted" style="margin:0">${W(_tx("Classificació"),_tx("Clasificación"))}: ${ord(pos)}${prev?(prev>pos?` <span class="good">▲${prev-pos}</span>`:prev<pos?` <span class="bad">▼${pos-prev}</span>`:" ="):""} · ${W(_tx("Ratxa"),_tx("Racha"))}: ${tb.find(x=>x.id===me).last.slice(-5).join(" ")}</p></div>`;

function pressQuestionStats(m){

function coachBase([nm,club,kind]){
  const h=hash(nm),ok=divOf(club)==="OK";

  return {nm,club,role,q,h};

  const all=COACHES_REAL.filter(x=>x[1]!==S.user).map(coachBase),out=[];

/* Nota de cada jugador al partit (sobre 10) i efecte en la forma, la moral i les mitjanes */
function rateMatch(m){
  const r=m.res,notes={};
  for(const [tid,ids,gf,gc] of [[m.h,r.lh,r.gh,r.ga],[m.a,r.la,r.ga,r.gh]]){
    const res=gf>gc?.6:gf<gc?-.6:0;
    for(const id of ids){const p=S.players[id];if(!p)continue;
      let n=6+res+(R()-.5)*1.2;
      for(const e of r.ev){if(e.pid!==id)continue;if(e.t==="goal")n+=p.pos==="DEF"?1.2:1;if(e.t==="blue")n-=.5;if(e.t==="fdmiss"||e.t==="pensave")n-=.3}
      for(const e of r.ev)if(e.t==="pensave"&&e.gk===id)n+=1;
      if(p.pos==="POR")n+=gc===0?1.5:gc<=2?.6:gc>=6?-1:gc>=4?-.4:0;
      n=Math.round(clamp(n,3,10)*2)/2;notes[id]=n;
      p.lastNota=n;p.noteSum=(p.noteSum||0)+n;p.noteN=(p.noteN||0)+1;p.form=Math.round(((p.form||0)*.7+(n-6)*.3)*100)/100;
      p.morale=clamp(p.morale+(n-6)*1.5,20,100);
      // les actuacions fan pujar o baixar les mitjanes (més fàcil de jove)
      const keys=p.pos==="POR"?["ref","col","pat"]:p.pos==="DEF"?["def","pat","tec","fis"]:["xut","tec","pat"];
      const k=keys[ri(0,keys.length-1)];
      if(n>=7.5&&R()<(p.age<=24?.45:p.age<=30?.3:.15))p.a[k]=clamp(p.a[k]+1,20,99);
      if(n<=4.5&&R()<(p.age>=31?.35:.2))p.a[k]=clamp(p.a[k]-1,20,99);
    }
  }
  r.notes=notes;return notes;
}
function boardAfter(m){
  const me=S.user,r=m.res,mine=m.h===me,gf=mine?r.gh:r.ga,gc=mine?r.ga:r.gh,opp=mine?m.a:m.h;
  const b=board(),stronger=teamOvr(opp)>teamOvr(me)+1,weaker=teamOvr(opp)<teamOvr(me)-1;
  b.conf+=gf>gc?(stronger?5:3):gf<gc?(weaker?-5:stronger?-1:-2.5):(stronger?1.5:weaker?-1.5:.5);
  const pos=table().findIndex(x=>x.id===me)+1,tg=TARGET(S.teams[me].rep);
  if(S.round>=6){if(pos>tg+2)b.conf-=1;else if(pos<=tg)b.conf+=1}

}

function simJornada(code,j){

    for(const [S,gf,gc] of [[H,gh,ga],[A,ga,gh]]){
      const res=gf>gc?"W":gf===gc?"D":"L";
      for(const p of S.played)players[p.id]={pl:1,st:S.starters.includes(p)?1:0,g:0,a:0,bl:0,rd:0,res,ga:p===S.gk?gc:0};
      for(let i=0;i<gf;i++){
        const sc=pickR(S.field,S.field.map(p=>Math.pow(p.r,3)*(p.pos==="DAV"?1.6:1)*(S.starters.includes(p)?1:.45)),r);players[sc.id].g++;

      }

      if(r()<.03){const p=S.field[Math.floor(r()*S.field.length)];players[p.id].rd++}

}

function fbAdapter(fs){

}

function canBuy(rec,p,prices){
  if(rec.squad.includes(p.id))return _tx("Ja el tens.");
  if(rec.squad.length>=FANT.squad)return `${_tx(`La plantilla ja té `)}${FANT.squad}${_tx(` jugadors. Ven-ne un primer.`)}`;
  const gks=rec.squad.filter(id=>FPM[id]&&FPM[id].pos==="POR").length,fld=rec.squad.length-gks;
  if(p.pos==="POR"&&gks>=FANT.gk)return _tx("Ja tens 2 porters.");
  if(p.pos!=="POR"&&fld>=FANT.squad-FANT.gk)return _tx("Ja tens 6 jugadors de pista.");
  if(rec.squad.filter(id=>FPM[id]&&FPM[id].team===p.team).length>=FANT.maxClub)return `${_tx(`Màxim `)}${FANT.maxClub}${_tx(` jugadors del mateix club.`)}`;
  if(prices[p.id].price>rec.bank+1e-9)return _tx("No tens prou pressupost.");
  return null;
}

function fTeamTab(L,rec,j,c,pr){
  if(rec.squad.length<FANT.squad)return `${_tx(`<section class="bevel panel"><h2>Completa la plantilla</h2><p style="margin:0">Necessites `)}${FANT.squad}${_tx(` jugadors: 2 porters i 6 de pista, com a màxim `)}${FANT.maxClub}${_tx(` del mateix club. Tens `)}${rec.squad.length}${_tx(` jugadors i `)}${fmtM(rec.bank)}${_tx(` per gastar.</p><button class="btn primary" data-ft="mercat" style="align-self:flex-start">Anar al mercat</button>`)}${rec.squad.length?squadTable(rec,pr,L):""}</section>`;
  const dr=draftFor(rec,L),locked=isLocked(L,j);
  const coords=[[50,87],[26,66],[74,66],[26,36],[74,36]];
  const slots=coords.map(([x,y],i)=>{const p=dr.xi[i]&&FPM[dr.xi[i]];return `${_tx(`<button class="slot `)}${F.sel===i?"sel":""} ${p?"":"empty"}${_tx(`" style="left:`)}${x}${_tx(`%;top:`)}${y}${_tx(`%" data-fs="`)}${i}" ${locked?"disabled":""}>${p?`<span class="nm">${dr.cap===p.id?"Ⓒ ":""}${esc(p.name)}</span><small>${p.pos} · ${esc(ABBR[p.team])} · ${fmtM(pr[p.id].price)}</small>`:`${_tx(`<span class="nm">Buit</span><small>`)}${i===0?_tx("Porter"):_tx("Jugador de pista")}</small>`}</button>`}).join("");
  const bench=rec.squad.filter(id=>!dr.xi.includes(id)).map(id=>FPM[id]).filter(Boolean);
  const lastPts=c?teamPoints(rec,L,c):null;
  return `${_tx(`<div class="lineup">
  <section class="bevel panel"><div class="row" style="justify-content:space-between"><h2>Alineació J`)}${j}</h2>${locked?_tx(`<span class="tag sale">TANCADA</span>`):dr.dirty?_tx(`<span class="tag" style="background:var(--warn);color:#fff">SENSE DESAR</span>`):_tx(`<span class="tag" style="background:var(--good);color:#fff">DESADA</span>`)}</div>
   <div class="rinkbox">${rinkSVG()}${slots}</div>
   <p class="muted" style="margin:0">${locked?_tx("La jornada ja ha començat. Podràs canviar l'alineació per a la propera."):_tx("Toca una posició i després un jugador de la banqueta. El capità suma el doble de punts.")}</p>
   ${locked?"":`${_tx(`<div class="row"><button class="btn primary" id="fSave" `)}${dr.xi.filter(Boolean).length<5||!dr.cap?"disabled":""}${_tx(`>Desar l'alineació</button><button class="btn" id="fAuto">Proposta automàtica</button></div>`)}`}${_tx(`</section>
  <section class="bevel panel"><h3>Capità</h3><div class="row">`)}${dr.xi.filter(Boolean).map(id=>`${_tx(`<button class="btn small `)}${dr.cap===id?"primary":""}${_tx(`" data-fc="`)}${id}" ${locked?"disabled":""}>${esc(FPM[id].name)}</button>`).join("")||_tx(`<span class="muted">Primer posa els cinc titulars.</span>`)}${_tx(`</div>
   <h3>Banqueta</h3>
   <div class="scroll"><table><thead><tr><th>Pos</th><th>Jugador</th><th>Club</th><th class="r">Punts</th><th></th></tr></thead><tbody>
   `)}${bench.map(p=>`${_tx(`<tr class="click" data-fb="`)}${p.id}${_tx(`" tabindex="0"><td>`)}${pos(p.pos)}</td><td>${esc(p.name)}</td><td>${esc(ABBR[p.team])}</td><td class="r">${pr[p.id].tot}</td><td>${F.sel!=null&&!locked?_tx(`<span class="acc">Entra ▸</span>`):""}</td></tr>`).join("")||_tx(`<tr><td colspan="5" class="muted">Tots els jugadors són titulars.</td></tr>`)}
   </tbody></table></div>
   ${lastPts!=null?`${_tx(`<p style="margin:0">Última jornada (J`)}${c}): <b class="acc">${lastPts}${_tx(` punts</b></p>`)}`:""}${_tx(`
  </section></div>
  <section class="bevel panel"><h3>Plantilla</h3>`)}${squadTable(rec,pr,L)}</section>`;
}
function squadTable(rec,pr,L){return `${_tx(`<div class="scroll"><table><thead><tr><th>Pos</th><th>Jugador</th><th>Club</th><th class="r">Mitjana</th><th class="r">Punts</th><th class="r">Preu</th><th></th></tr></thead><tbody>
  `)}${rec.squad.map(id=>FPM[id]).filter(Boolean).sort((a,b)=>_tx("PORDEFDAV").indexOf(a.pos)-_tx("PORDEFDAV").indexOf(b.pos)).map(p=>`<tr><td>${pos(p.pos)}</td><td>${esc(p.name)}</td><td>${esc(ABBR[p.team])}</td><td class="r">${p.r}</td><td class="r">${pr[p.id].tot}</td><td class="r">${fmtM(pr[p.id].price)}${_tx(`</td><td><button class="btn small" data-fsell="`)}${p.id}${_tx(`">Vendre</button></td></tr>`)}`).join("")}</tbody></table></div>`}
function fMarketTab(L,rec,j,c,pr){
  const q=F.mQ.toLowerCase();
  const list=FPL.filter(p=>(F.mPos==="TOT"||p.pos===F.mPos)&&(F.mTeam==="TOT"||p.team===F.mTeam)&&(!q||p.name.toLowerCase().includes(q))).sort((a,b)=>pr[b.id].price-pr[a.id].price);
  const gks=rec.squad.filter(id=>FPM[id]&&FPM[id].pos==="POR").length;
  return `${_tx(`<section class="bevel panel"><div class="row" style="justify-content:space-between"><h2>Mercat</h2><span class="muted">Pressupost <b>`)}${fmtM(rec.bank)}${_tx(`</b> · Porters `)}${gks}${_tx(`/2 · Pista `)}${rec.squad.length-gks}${_tx(`/6</span></div>
  <div class="row"><label class="lbl" for="fmQ">Cerca</label><input id="fmQ" value="`)}${esc(F.mQ)}${_tx(`" placeholder="Nom del jugador">
   <label class="lbl" for="fmPos">Posició</label><select id="fmPos">`)}${["TOT","POR","DEF","DAV"].map(x=>`${_tx(`<option `)}${F.mPos===x?"selected":""}>${x}</option>`).join("")}${_tx(`</select>
   <label class="lbl" for="fmTeam">Club</label><select id="fmTeam"><option value="TOT">Tots</option>`)}${TEAMS0.map(t=>`${_tx(`<option value="`)}${t.id}" ${F.mTeam===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}${_tx(`</select></div>
  <div class="scroll"><table><thead><tr><th>Pos</th><th>Jugador</th><th>Club</th><th class="r">Mitjana</th><th class="r">Punts</th><th class="r">Últ.</th><th class="r">Preu</th><th></th></tr></thead><tbody>
  `)}${list.map(p=>{const mine=rec.squad.includes(p.id),x=pr[p.id],tr=x.price-x.base;const no=mine?null:canBuy(rec,p,pr);
    return `${_tx(`<tr class="`)}${mine?"me":""}"><td>${pos(p.pos)}</td><td>${esc(p.name)}</td><td><span class="row" style="gap:6px;flex-wrap:nowrap">${shield(TM[p.team],18)}${esc(ABBR[p.team])}</span></td><td class="r">${p.r}</td><td class="r">${x.tot}</td><td class="r muted">${x.last==null?"–":x.last}</td>
    <td class="r"><b>${fmtM(x.price)}</b>${Math.abs(tr)>=.05?`${_tx(` <span class="`)}${tr>0?"good":"bad"}">${tr>0?"▲":"▼"}</span>`:""}</td>
    <td>${mine?`${_tx(`<button class="btn small" data-fsell="`)}${p.id}${_tx(`">Vendre</button>`)}`:`${_tx(`<button class="btn small `)}${no?"":"primary"}${_tx(`" data-fbuy="`)}${p.id}${_tx(`" title="`)}${esc(no||_tx("Fitxar"))}${_tx(`">Fitxar</button>`)}`}</td></tr>`}).join("")}
  </tbody></table></div></section>`;
}
function fBoardTab(L,rec,j,c){
  const rows=(F.board[F.code]||[]).map(x=>({...x,tot:totalPoints(x.rec,L),last:c?teamPoints(x.rec,L,c):null})).sort((a,b)=>b.tot-a.tot);
  return `${_tx(`<section class="bevel panel"><h2>Classificació</h2>`)}${rows.length?`${_tx(`<div class="scroll"><table><thead><tr><th>#</th><th>Equip</th><th>Mànager</th><th class="r">J`)}${c||"-"}${_tx(`</th><th class="r">Total</th></tr></thead><tbody>
  `)}${rows.map((x,i)=>`${_tx(`<tr class="`)}${x.uid===F.uid?"me":""}"><td>${i+1}</td><td><b>${esc(x.rec.name)}</b></td><td class="muted">${esc(F.names[x.uid]||(x.uid===F.uid?_tx("Tu"):_tx("Membre")))}</td><td class="r">${x.last==null?"–":x.last}</td><td class="r"><b class="acc">${x.tot}</b></td></tr>`).join("")}</tbody></table></div>`:_tx(`<p class="muted" style="margin:0">Carregant…</p>`)}${_tx(`
  <p class="muted" style="margin:0">Passa el codi <b>`)}${esc(L.code)}${_tx(`</b> als teus amics perquè hi entrin. `)}${F.backend==="firebase"?_tx("Només cal que obrin el joc i entrin amb el seu compte de Google."):_tx("Per poder jugar, cal que els convidis a aquesta pàgina per correu com a <b>editors</b> des del botó de compartir.")}${_tx(`</p>
  <div class="row"><button class="btn small" id="fLeave">Sortir d'aquesta lliga</button><span id="fLeaveC" hidden class="row"><span class="warn">Perdràs el teu equip en aquesta lliga.</span><button class="btn small primary" id="fLeaveY">Sí, surt</button><button class="btn small" id="fLeaveN">Cancel·la</button></span></div></section>`)}`;
}
function fRoundsTab(L,rec,j,c){
  const jv=F.jView&&F.jView<=Math.max(c,1)?F.jView:Math.max(c,1);
  const st=statsFor(L,jv),ms=matchesFor(L,jv),lu=lineupFor(rec,jv);
  const isOwner=L.owner===F.uid;
  const simCtl=L.mode==="sim"?(isOwner?`${_tx(`<div class="row"><button class="btn primary" id="fSim" `)}${c>=26?"disabled":""}${_tx(`>Simular la jornada `)}${c+1}${_tx(`</button><span class="muted">Ets el creador de la lliga: tu fas avançar les jornades.</span></div>`)}`:_tx(`<p class="muted" style="margin:0">El creador de la lliga fa avançar les jornades simulades.</p>`))
    :_tx(`<p class="muted" style="margin:0">Els punts de cada jornada s'afegeixen quan s'han jugat tots els partits, a partir de les actes de la RFEP.</p>`);
  const sel=`<select id="fjSel">${Array.from({length:Math.max(c,1)},(_,i)=>i+1).map(k=>`${_tx(`<option value="`)}${k}" ${k===jv?"selected":""}${_tx(`>Jornada `)}${k}</option>`).join("")}</select>`;
  let detail=_tx(`<p class="muted" style="margin:0">Encara no s'ha jugat cap jornada.</p>`);
  if(st){
    const rows=(lu?lu.xi:[]).map(id=>FPM[id]).filter(Boolean).map(p=>{const s=st[p.id];let v=fpPoints(p.pos,s);const cap=lu.cap===p.id;if(cap)v*=2;
      return `<tr><td>${pos(p.pos)}</td><td>${cap?"Ⓒ ":""}${esc(p.name)}</td><td>${esc(ABBR[p.team])}</td><td class="muted">${s&&s.pl?`${s.st?_tx("Titular"):_tx("Suplent")}${s.g?` · ${s.g}${_tx(` gol`)}${s.g>1?"s":""}`:""}${s.a?` · ${s.a}${_tx(` assist.`)}`:""}${s.bl?` · ${s.bl}${_tx(` blava`)}`:""}${s.rd?_tx(" · vermella"):""}${p.pos==="POR"&&s.st?` · ${s.ga}${_tx(` encaixats`)}`:""}`:_tx("No ha jugat")}</td><td class="r"><b>${v}</b></td></tr>`}).join("");
    detail=`${_tx(`<h3>El meu equip</h3>`)}${lu?`<div class="scroll"><table><tbody>${rows}${_tx(`<tr><td colspan="4"><b>Total</b></td><td class="r"><b class="acc">`)}${teamPoints(rec,L,jv)}</b></td></tr></tbody></table></div>`:_tx(`<p class="muted" style="margin:0">No tenies alineació per a aquesta jornada.</p>`)}
     ${ms?`${_tx(`<h3>Resultats</h3><table><tbody>`)}${ms.map(([h,a,gh,ga])=>`<tr><td style="white-space:normal">${esc(TM[h]?TM[h].name:h)}</td><td class="r num" style="width:60px"><b>${gh}–${ga}</b></td><td style="white-space:normal">${esc(TM[a]?TM[a].name:a)}</td></tr>`).join("")}</tbody></table>`:""}`;
  }
  const next=calJ(j);
  return `${_tx(`<div class="grid2" style="align-items:start"><section class="bevel panel"><div class="row" style="justify-content:space-between"><h2>Jornades</h2>`)}${c?sel:""}</div>${simCtl}${detail}${_tx(`</section>
  <section class="bevel panel"><h2>Propera: J`)}${j}</h2><table><tbody>${next.map(([h,a,d])=>`<tr><td style="white-space:normal">${esc(TM[h].name)}</td><td class="muted" style="width:90px">${L.mode==="sim"?"":esc(d.slice(8,10)+"/"+d.slice(5,7)+" "+d.slice(11))}</td><td style="white-space:normal">${esc(TM[a].name)}</td></tr>`).join("")}</tbody></table></section></div>`;
}
function fRulesTab(){return `${_tx(`<section class="bevel panel" style="max-width:760px"><h2>Normes</h2>
  <p style="margin:0">Cada mànager té <b>`)}${FANT.budget}${_tx(` M</b> per fer una plantilla de <b>`)}${FANT.squad}${_tx(` jugadors</b> (2 porters i 6 de pista), amb un màxim de `)}${FANT.maxClub}${_tx(` jugadors del mateix club. Cada jornada alineeu un porter i quatre jugadors de pista, i trieu un capità.</p>
  <p style="margin:0">Els preus parteixen de la mitjana de cada jugador i pugen o baixen segons els punts que fa. Vens al preu del moment.</p>
  <h3>Punts per partit</h3><table><tbody>`)}${RULES.map(([a,b])=>`<tr><td>${a}</td><td class="r"><b>${b}</b></td></tr>`).join("")}${_tx(`</tbody></table>
  <p class="muted" style="margin:0">Si no deses alineació per a una jornada, es fa servir l'última que hagis desat. En les lligues de partits reals, l'alineació es tanca quan comença el primer partit de la jornada.</p>`)}${LEGAL.replace('class="legal"',_tx("class=\"legal\" style=\"padding:0\""))}</section>`}

function bindF(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  on("#fLogin","click",async()=>{try{await F.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){if(e&&e.code!=="auth/popup-closed-by-user")toast(_tx("No s'ha pogut iniciar la sessió."))}});
  on("#fDelMe","click",()=>{F.delArm=true;render()});
  on("#fDelNo","click",()=>{F.delArm=false;render()});
  on("#fDelYes","click",()=>fWrite(async()=>{await F.db.doc(_tx("teams/")+F.uid).delete();F.delArm=false;F.me=null;F.code=null},_tx("Dades esborrades.")));
  on("#fLogout","click",async()=>{await F.auth.signOut();F.me=null;F.code=null;F.leagues={};F.lsub={};F.board={};F.bsub={};render()});
  on("#fMenu","click",()=>{MODE=null;startStep="menu";render();window.scrollTo(0,0)});
  on("[data-fl]","click",e=>{const c=e.currentTarget.dataset.fl;F.code=c||null;F.tab="equip";F.sel=null;F.draft=null;render();window.scrollTo(0,0)});
  on("[data-ft]","click",e=>{F.tab=e.currentTarget.dataset.ft;F.sel=null;render()});
  on("#fCopy","click",async()=>{try{await navigator.clipboard.writeText(lg().code);toast(_tx("Codi copiat"))}catch(e){toast(_tx("Selecciona el codi i copia'l"))}});
  on("#fcGo","click",()=>{const n=$("#fcName").value.trim(),t=$("#fcTeam").value.trim(),m=(document.querySelector('input[name="fcMode"]:checked')||{}).value||"real";
    fWrite(()=>createLeague(n,m,t),_tx("Lliga creada. Ara fes la plantilla."))});
  on("#fjGo","click",()=>{const c=$("#fjCode").value.trim(),t=$("#fjTeam").value.trim();if(c.length<4){toast(_tx("Escriu el codi de la lliga."));return}fWrite(()=>joinLeague(c,t))});
  on("[data-fbuy]","click",e=>buy(e.currentTarget.dataset.fbuy));
  on("[data-fsell]","click",e=>sell(e.currentTarget.dataset.fsell));
  const mq=$("#fmQ");if(mq)mq.oninput=()=>{F.mQ=mq.value;const p=mq.selectionStart;render();const n=$("#fmQ");n.focus();n.setSelectionRange(p,p)};
  on("#fmPos","change",e=>{F.mPos=e.currentTarget.value;render()});
  on("#fmTeam","change",e=>{F.mTeam=e.currentTarget.value;render()});
  on("[data-fs]","click",e=>{const i=+e.currentTarget.dataset.fs;F.sel=F.sel===i?null:i;render()});
  const benchPick=id=>{const L=lg(),rec=myRec(),dr=draftFor(rec,L);if(F.sel==null){toast(_tx("Primer toca una posició de la pista"));return}
    const p=FPM[id];if(F.sel===0&&p.pos!=="POR"){toast(_tx("A la porteria hi ha d'anar un porter"));return}if(F.sel>0&&p.pos==="POR"){toast(_tx("Un porter no pot jugar de jugador de pista"));return}
    const out=dr.xi[F.sel];dr.xi[F.sel]=id;if(dr.cap===out)dr.cap=null;if(!dr.cap&&F.sel>0)dr.cap=id;dr.dirty=true;F.sel=null;render()};
  on("[data-fb]","click",e=>benchPick(e.currentTarget.dataset.fb));
  on("[data-fb]","keydown",e=>{if(e.key==="Enter")benchPick(e.currentTarget.dataset.fb)});
  on("[data-fc]","click",e=>{const dr=draftFor(myRec(),lg());dr.cap=e.currentTarget.dataset.fc;dr.dirty=true;render()});
  on("#fAuto","click",()=>{const dr=draftFor(myRec(),lg());const a=autoXI(myRec().squad);dr.xi=a.xi;dr.cap=a.cap;dr.dirty=true;render()});
  on("#fSave","click",()=>{const L=lg(),dr=draftFor(myRec(),L);if(isLocked(L,dr.j)){toast(_tx("La jornada ja ha començat"));return}
    fWrite(async()=>{await updRec({lineups:{[dr.j]:{xi:dr.xi,cap:dr.cap}}});dr.dirty=false},_tx("Alineació desada"))});
  on("#fjSel","change",e=>{F.jView=+e.currentTarget.value;render()});
  on("#fSim","click",()=>{const L=lg();fWrite(()=>F.db.doc(_tx("leagues/")+L.code).update({simRound:(L.simRound||0)+1}),`${_tx(`Jornada `)}${(L.simRound||0)+1}${_tx(` simulada`)}`)});
  on("#fLeave","click",()=>{$("#fLeaveC").hidden=false});
  on("#fLeaveN","click",()=>{$("#fLeaveC").hidden=true});
  on("#fLeaveY","click",()=>{const c=F.code;fWrite(()=>leaveLeague(c),_tx("Has sortit de la lliga"))});
}

function start(data){if(data&&data.S){S=migrate(data.S);view=data.view||"inici"}render();
  // Si el navegador ha esborrat el localStorage però queda la còpia a IndexedDB, la recuperem
  let has=false;try{has=!!localStorage.getItem(SAVE)}catch(e){}
  if(has){try{const j=localStorage.getItem(SAVE);IDB.get(SAVE).then(x=>{if(!x)IDB.put(SAVE,j)})}catch(e){}}
  else IDB.get(SAVE).then(j=>{if(!j)return;try{localStorage.setItem(SAVE,j)}catch(e){}if(!S&&MODE!=="fantasy"){render()}})}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("navopen")){document.body.classList.remove("navopen");const b=$("#bNav");if(b)b.focus()}});
window.claude?.hot?.snapshot?.(()=>({S,view:view==="partit"?"inici":view}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
