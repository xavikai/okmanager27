<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app esportiva actual — barra de club amb el color de l'equip, menú lateral (pestanyes a mòbil), targetes netes */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#f6f8fb; --line:#e3e8ef; --line2:#d3dae4;
  --fg:#0f1722; --dim:#5f6b7b; --accent:#1f6feb; --accent-fg:#ffffff; --data:#1f6feb;
  --good:#12a150; --bad:#e5484d; --warn:#d97706; --team:#1f6feb;
  --rink:#2a6fc0; --rinkline:#eaf2ff; --board:#0d1320; --boardfg:#f3f6fb;
  --shadow:0 1px 2px rgba(15,23,34,.06),0 4px 16px rgba(15,23,34,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --panel:#141a22; --panel2:#19212b; --line:#232c38; --line2:#2e3947;
  --fg:#e8edf4; --dim:#8b97a8; --accent:#4c8dff; --accent-fg:#06101f; --data:#6aa5ff;
  --good:#35c47a; --bad:#ff6b6e; --warn:#f0a43a; --rink:#1f5aa3; --rinkline:#d6e6ff; --board:#06090f; --boardfg:#f3f6fb;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --panel:#141a22; --panel2:#19212b; --line:#232c38; --line2:#2e3947;
  --fg:#e8edf4; --dim:#8b97a8; --accent:#4c8dff; --accent-fg:#06101f; --data:#6aa5ff;
  --good:#35c47a; --bad:#ff6b6e; --warn:#f0a43a; --rink:#1f5aa3; --rinkline:#d6e6ff; --board:#06090f; --boardfg:#f3f6fb;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font-family:inherit;font-size:15px;background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.wrap{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.bevel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2);border-color:var(--dim)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.005em;line-height:1.05}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:18px;text-transform:uppercase;color:var(--dim)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--accent)}.dat{color:var(--data)}

/* Start */
.start{display:grid;gap:18px}
.logo{position:relative;overflow:hidden;border-radius:18px;padding:34px 28px;background:var(--board);color:var(--boardfg);display:flex;flex-direction:column;gap:8px}
.logo::after{content:"";position:absolute;right:-60px;top:-60px;width:320px;height:320px;border-radius:50%;border:3px solid rgba(255,255,255,.12);box-shadow:0 0 0 46px rgba(255,255,255,.03)}
.logo .big{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(46px,9vw,86px);line-height:.88;text-transform:uppercase;letter-spacing:-.01em}
.logo .big em{color:#5aa2ff;font-style:italic}
.logo .sub{font-size:15px;opacity:.75;max-width:60ch}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.teamcard{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px}
.teamcard:hover{border-color:var(--accent)}
.teamcard .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.teamcard b{font-size:16px}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px}

/* Shell */
.top{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding:14px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--team)}
.top .club{display:flex;gap:12px;align-items:center;margin-right:auto;min-width:0}
.top .club b{font-family:var(--f-display);font-size:28px;line-height:1;text-transform:uppercase}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.shell{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
nav.menu{display:flex;flex-direction:column;gap:2px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
nav.menu button{text-align:left;background:transparent;border:0;border-radius:9px;padding:9px 12px;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:6px;color:var(--dim)}
nav.menu button:hover{background:var(--panel2);color:var(--fg)}
nav.menu button[aria-current="page"]{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 var(--accent)}
nav.menu .badge{background:var(--bad);color:#fff;font-size:11.5px;padding:0 7px;border-radius:10px;line-height:18px}
nav.menu .sep{height:1px;background:var(--line);margin:6px 8px}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.me td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
td.r,th.r{text-align:right}
.pos{display:inline-block;min-width:36px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.pos.POR{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pos.DEF{background:color-mix(in srgb,var(--data) 16%,transparent);color:var(--data)}
.pos.DAV{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.ovr{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.bar{width:56px;height:6px;background:var(--line);display:inline-block;vertical-align:middle;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
.tag.inj{background:var(--bad);color:#fff}.tag.sale{background:var(--warn);color:#fff}
.zone-top td:first-child{box-shadow:inset 3px 0 var(--good)}
.zone-bot td:first-child{box-shadow:inset 3px 0 var(--bad)}

/* Next match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .side b{font-size:16px}
.vs .mid{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:30px;color:var(--dim)}
.news{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.news li{border-left:2px solid var(--line2);padding:2px 0 2px 12px}
.news li.hot{border-color:var(--accent)}

/* Rink */
.lineup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.rinkbox{position:relative;width:100%;max-width:100%;aspect-ratio:20/40;max-height:560px;margin:0 auto}
.rinkbox svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:122px;max-width:44%;padding:7px 6px;text-align:center;background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:1px;align-items:center}
.slot.sel{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.slot.empty{border-style:dashed;opacity:.9}
.slot small{font-size:11.5px;opacity:.8}
.slot .nm{font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Match */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:22px 16px;background:var(--board);color:var(--boardfg);border-radius:14px;text-align:center}
.board .sc{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,11vw,84px);line-height:.9}
.board .clk{display:inline-block;margin-top:6px;font-family:var(--f-display);font-weight:700;font-size:18px;background:rgba(255,255,255,.1);padding:2px 10px;border-radius:6px}
.board .tn{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,3.5vw,24px);text-transform:uppercase;line-height:1.05}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 10px;background:var(--panel2);border-radius:9px}
.feed li .m{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--dim);line-height:1.3}
.feed li.goal{background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.feed li.blue{background:color-mix(in srgb,var(--data) 13%,var(--panel))}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(6,10,18,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{width:min(560px,100%);max-height:90vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
.attr{display:flex;justify-content:space-between;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
details summary{list-style:revert}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.menu{flex-direction:row;overflow-x:auto;position:static;padding:6px}
  nav.menu button{white-space:nowrap;flex:0 0 auto}
  nav.menu button[aria-current="page"]{box-shadow:inset 0 -3px var(--accent)}
  nav.menu .sep{display:none}
  .lineup{grid-template-columns:1fr}
  .rinkbox{max-height:520px;max-width:300px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ============ UTILITATS ============ */
const $=s=>document.querySelector(s);
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b,r=R)=>Math.floor(r()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=k=>Math.abs(k)>=1000?(k/1000).toFixed(2).replace(".",",")+" M€":(Math.round(k*1000/10)*10).toLocaleString("ca-ES")+" €";
const eurMes=p=>monthlyOf(p).toLocaleString("ca-ES")+" €/mes";
const monthlyOf=p=>Math.round(p.salary*1000/10/10)*10;
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function pickW(arr,w){const s=w.reduce((a,b)=>a+b,0);let x=R()*s;for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i]}return arr[arr.length-1]}

/* ============ JUGADORS ============ */
function makePlayer(a,team,id){
  const [name,pos,age0,med,nat,inj]=a;const r=rng(hash(name));const v=(x,y)=>ri(x,y,r);const age=age0||(20+hash(name+"e")%13);
  let at;
  if(pos==="POR")at={ref:med+v(-2,4),col:med+v(-4,3),pat:med-10+v(-3,3),tec:40+v(0,15),xut:30+v(0,15),def:45+v(0,10),fis:med-6+v(-3,3)};
  else if(pos==="DEF")at={def:med+v(1,6),pat:med+v(-3,3),tec:med+v(-6,0),xut:med+v(-7,1),fis:med+v(-2,4),ref:20,col:20};
  else at={xut:med+v(1,6),tec:med+v(0,5),pat:med+v(-2,3),def:med+v(-13,-5),fis:med+v(-5,2),ref:20,col:20};
  for(const k in at)at[k]=clamp(at[k],20,99);
  const p={id,name,team,pos,age,nat:nat||"ESP",a:at,s:a[6]||null,energy:100,morale:70,inj:inj||0,goals:0,apps:0,cards:0,forSale:false};
  p.salary=salaryOf(med,age,team);p.contract=2027+(hash(name)%3);
  return p;
}
function ovr(p){const a=p.a;
  if(p.pos==="POR")return Math.round(a.ref*.5+a.col*.35+a.pat*.15);
  if(p.pos==="DEF")return Math.round(a.def*.4+a.pat*.25+a.tec*.15+a.fis*.2);
  return Math.round(a.xut*.35+a.tec*.3+a.pat*.25+a.fis*.1)}
/* Sous (estimats): els clubs grans (Barça, Liceo, Noia) paguen 1.000-3.000 €/mes als titulars;
   la resta, menys. Internament el sou es guarda en k€ per temporada (10 mensualitats). */
const TIER={BAR:"A",LIC:"A",NOI:"A",IGU:"B",REU:"B",CAL:"B",VOL:"B",LLE:"B"};
const tierOf=tid=>TIER[tid]||"C";
function monthly(m,age,tier){const x=Math.pow(clamp((m-68)/24,0,1),1.6);const [f,k]=tier==="A"?[300,2700]:tier==="B"?[150,1350]:[50,650];let v=f+k*x;if(age>32)v*=.9;if(age<20)v*=.6;return Math.round(v/10)*10}
function salaryOf(m,age,tid){return monthly(m,age,tierOf(tid))*10/1000}
const perMonth=p=>Math.round(p.salary*100)*1;
function valueOf(p){const m=ovr(p);const ag=p.age<=23?1.4:p.age<=27?1.15:p.age<=30?1:p.age<=33?.6:.3;return Math.max(.3,Math.round(monthly(m,p.age,"B")*6*ag/100)/10)}
const atkR=p=>p.a.xut*.4+p.a.tec*.35+p.a.pat*.25;
const defR=p=>p.a.def*.55+p.a.pat*.25+p.a.fis*.2;

function newGame(teamId){
  R=Math.random;
  const st={ver:1,season:2026,user:teamId,round:0,teams:{},players:{},news:[],ledger:[],offers:[],nextId:1};
  for(const t of TEAMS0){
    st.teams[t.id]={id:t.id,name:t.name,city:t.city,c1:t.c1,c2:t.c2,rep:t.rep,budget:t.bud,arena:t.arena,lineup:[],tactic:{style:"EQU",press:"MIG"}};
    for(const a of t.p){const id="p"+(st.nextId++);st.players[id]=makePlayer(a,t.id,id)}
  }
  st.fixtures=makeFixtures(TEAMS0.map(t=>t.id),hash(teamId+Date.now()));
  S=st;
  for(const id in S.teams)autoLineup(id);
  const me=S.teams[teamId];
  pushNews(`Benvingut a ${me.name}. La directiva t'encarrega la temporada ${S.season}-${(S.season+1)%100}.`,true);
  pushNews(`Pressupost inicial: ${money(me.budget)}. La massa salarial és de ${money(salaryMass(teamId))} per temporada.`);
  save();
}
function makeFixtures(ids,seed){
  const r=rng(seed);const t=ids.slice();for(let i=t.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[t[i],t[j]]=[t[j],t[i]]}
  const n=t.length,rounds=[];let arr=t.slice();
  for(let k=0;k<n-1;k++){const m=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((k+i)%2)[h,a]=[a,h];m.push({h,a,res:null})}rounds.push(m);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  const back=rounds.map(rd=>rd.map(m=>({h:m.a,a:m.h,res:null})));
  return rounds.concat(back);
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function pushNews(t,hot){S.news.unshift({r:S.round,t,hot:!!hot});S.news=S.news.slice(0,40)}

const squad=tid=>Object.values(S.players).filter(p=>p.team===tid);
const salaryMass=tid=>squad(tid).reduce((s,p)=>s+p.salary,0);
const avail=p=>p.inj<=0;
function teamOvr(tid){const L=lineupOf(tid).map(id=>S.players[id]);return L.length?Math.round(L.reduce((s,p)=>s+ovr(p),0)/L.length):0}
function autoLineup(tid){
  const sq=squad(tid).filter(avail).sort((a,b)=>ovr(b)*(.75+.25*b.energy/100)-ovr(a)*(.75+.25*a.energy/100));
  const gk=sq.find(p=>p.pos==="POR");
  const defs=sq.filter(p=>p.pos==="DEF"),davs=sq.filter(p=>p.pos==="DAV");
  const L=[gk&&gk.id,defs[0]&&defs[0].id,defs[1]&&defs[1].id,davs[0]&&davs[0].id,davs[1]&&davs[1].id];
  const used=new Set(L.filter(Boolean));
  const rest=sq.filter(p=>p.pos!=="POR"&&!used.has(p.id));
  for(let i=1;i<5;i++)if(!L[i]&&rest.length){const p=rest.shift();L[i]=p.id;used.add(p.id)}
  S.teams[tid].lineup=L.map(x=>x||null);
}
function lineupOf(tid){
  const L=S.teams[tid].lineup.filter(id=>id&&S.players[id]&&S.players[id].team===tid&&avail(S.players[id]));
  if(L.length<5||!L.some(id=>S.players[id].pos==="POR")){autoLineup(tid);return S.teams[tid].lineup.filter(Boolean)}
  return L;
}

/* ============ SIMULADOR DE PARTIT ============ */
function strength(tid,home){
  const t=S.teams[tid],L=lineupOf(tid).map(id=>S.players[id]);
  const gk=L.find(p=>p.pos==="POR")||L[0];const f=L.filter(p=>p!==gk);
  const cond=p=>(.9+.1*p.energy/100)*(.97+.06*p.morale/100);
  let att=f.reduce((s,p)=>s+atkR(p)*cond(p),0)/Math.max(1,f.length);
  let def=f.reduce((s,p)=>s+defR(p)*cond(p),0)/Math.max(1,f.length);
  let g=ovr(gk)*cond(gk);
  const st=t.tactic.style,pr=t.tactic.press;
  if(st==="ATA"){att*=1.05;def*=.95}else if(st==="DEF"){att*=.95;def*=1.05}
  if(pr==="ALT"){att*=1.025;def*=1.015}else if(pr==="BAI"){att*=.985}
  if(home)att*=1.035;
  return {att,def,g,L,gk,f};
}
function simMatch(h,a){
  const H=strength(h,true),A=strength(a,false);
  const lam=(x,y)=>clamp(2.5*Math.pow(x.att/(y.def*.55+y.g*.45),4.2),.3,8);
  const gh=poisson(lam(H,A)),ga=poisson(lam(A,H));
  const ev=[];
  const scorer=s=>pickW(s.f,s.f.map(p=>Math.pow(p.a.xut,2)*(p.pos==="DAV"?1.5:1)));
  const addGoals=(n,side,tid,opp)=>{for(let i=0;i<n;i++){const p=scorer(side);const k=R();const type=k<.09?"penal":k<.17?"falta directa":"jugada";ev.push({m:ri(1,50),t:"goal",tid,pid:p.id,type})}};
  addGoals(gh,H,h,A);addGoals(ga,A,a,H);
  [[H,h,A],[A,a,H]].forEach(([s,tid,o])=>{
    const nb=poisson(.9);for(let i=0;i<nb;i++){const p=s.f[ri(0,s.f.length-1)];ev.push({m:ri(1,50),t:"blue",tid,pid:p.id})}
    const nm=poisson(.55);for(let i=0;i<nm;i++){const p=scorer(s);ev.push({m:ri(1,50),t:R()<.5?"fdmiss":"pensave",tid,pid:p.id,gk:o.gk.id})}
    if(R()<.09){const p=s.L[ri(0,s.L.length-1)];ev.push({m:ri(5,48),t:"inj",tid,pid:p.id,w:ri(1,4)})}
  });
  ev.sort((x,y)=>x.m-y.m);
  return {gh,ga,ev,lh:H.L.map(p=>p.id),la:A.L.map(p=>p.id)};
}
function applyResult(m){
  const r=m.res;
  for(const e of r.ev){const p=S.players[e.pid];if(!p)continue;
    if(e.t==="goal")p.goals++;if(e.t==="blue")p.cards++;if(e.t==="inj")p.inj=Math.max(p.inj,e.w+1)}
  const played=new Set([...r.lh,...r.la]);
  for(const tid of [m.h,m.a]){
    const press=S.teams[tid].tactic.press;
    for(const p of squad(tid)){
      if(played.has(p.id)){p.apps++;p.energy=clamp(p.energy-(press==="ALT"?14:press==="BAI"?6:10),40,100)}
      else p.energy=clamp(p.energy+20,0,100);
      const win=(tid===m.h?r.gh>r.ga:r.ga>r.gh),lose=(tid===m.h?r.gh<r.ga:r.ga<r.gh);
      p.morale=clamp(p.morale+(win?5:lose?-5:0),20,100);
    }
  }
}
function evText(e,m){
  const p=S.players[e.pid],n=p?p.name:"?",tn=S.teams[e.tid].name;
  if(e.t==="goal")return e.type==="penal"?`GOL! ${n} transforma el penal (${tn})`:e.type==="falta directa"?`GOL de falta directa! ${n} enganya el porter (${tn})`:`GOL! ${n} remata la jugada (${tn})`;
  if(e.t==="blue")return `Targeta blava a ${n} (${tn}). 2 minuts d'inferioritat`;
  if(e.t==="fdmiss")return `Falta directa de ${n}… fora! (${tn})`;
  if(e.t==="pensave")return `${S.players[e.gk]?S.players[e.gk].name:"El porter"} atura el penal de ${n}`;
  if(e.t==="inj")return `${n} es retira lesionat (${tn}). Baixa de ${e.w} setm.`;
  return "";
}

/* ============ JORNADA ============ */
function playRound(){
  if(S.round>=S.fixtures.length)return;
  const me=S.user,rd=S.fixtures[S.round];
  for(const tid in S.teams)if(tid!==me)aiTactic(tid);
  for(const m of rd){m.res=simMatch(m.h,m.a);applyResult(m)}
  // lesions i recuperació
  for(const p of Object.values(S.players))if(p.inj>0)p.inj--;
  finances(rd);
  aiOffers();
  const um=rd.find(m=>m.h===me||m.a===me);
  const r=um.res,mine=um.h===me?[r.gh,r.ga]:[r.ga,r.gh];
  const opp=S.teams[um.h===me?um.a:um.h].name;
  S.round++;
  pushNews(`J${S.round}: ${S.teams[um.h].name} ${r.gh}-${r.ga} ${S.teams[um.a].name}. ${mine[0]>mine[1]?"Victòria":mine[0]<mine[1]?"Derrota":"Empat"} contra el ${opp}.`,true);
  for(const p of squad(me))if(p.inj>0&&um.res.ev.some(e=>e.t==="inj"&&e.pid===p.id))pushNews(`${p.name} estarà ${p.inj} setmanes de baixa.`);
  autoFix(me);
  for(const tid in S.teams)if(tid!==me)autoLineup(tid);
  if(S.round>=S.fixtures.length)endSeason();
  save();
  ui.match={m:um,round:S.round};
  view="partit";
}
function autoFix(tid){const L=S.teams[tid].lineup;if(L.some(id=>!id||!S.players[id]||S.players[id].team!==tid||!avail(S.players[id])))autoLineup(tid)}
function aiTactic(tid){const t=S.teams[tid];const o=teamOvr(tid);t.tactic.style=o>=81?"ATA":o<=74?"DEF":"EQU";t.tactic.press=R()<.3?"ALT":"MIG"}
function finances(rd){
  for(const tid in S.teams){
    const t=S.teams[tid],home=rd.some(m=>m.h===tid);
    const m=rd.find(x=>x.h===tid||x.a===tid),won=m&&m.res&&((m.h===tid&&m.res.gh>m.res.ga)||(m.a===tid&&m.res.ga>m.res.gh));
    if(!t.inc)t.inc=Math.round((salaryMass(tid)*1.02+t.rep*2)*10)/10;const base=t.inc/26,tickets=home?Math.round(base*.9*(.85+R()*.3)*10)/10:0,spons=Math.round((base*.55+(won?t.rep*.15:0))*10)/10,sal=Math.round(salaryMass(tid)/26*10)/10;
    t.budget+=tickets+spons-sal;
    if(tid===S.user)S.ledger.unshift({r:S.round+1,tickets,spons,sal});
  }
  S.ledger=S.ledger.slice(0,60);
}

/* ============ CLASSIFICACIÓ ============ */
function table(){
  const T={};for(const id in S.teams)T[id]={id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,last:[]};
  for(const rd of S.fixtures)for(const m of rd){if(!m.res)continue;const h=T[m.h],a=T[m.a],x=m.res.gh,y=m.res.ga;
    h.pj++;a.pj++;h.gf+=x;h.gc+=y;a.gf+=y;a.gc+=x;
    if(x>y){h.g++;a.p++;h.pts+=3;h.last.push("V");a.last.push("D")}else if(x<y){a.g++;h.p++;a.pts+=3;h.last.push("D");a.last.push("V")}else{h.e++;a.e++;h.pts++;a.pts++;h.last.push("E");a.last.push("E")}}
  return Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
}
function endSeason(){
  const tb=table(),pos=tb.findIndex(r=>r.id===S.user)+1;
  S.finished=true;
  pushNews(`Final de temporada! Campió: ${S.teams[tb[0].id].name}. ${S.teams[S.user].name} acaba ${pos}è.`,true);
  tb.forEach((r,i)=>{S.teams[r.id].budget+=Math.round((14-i)*.8*10)/10});
}
function newSeason(){
  S.season++;S.round=0;S.finished=false;S.offers=[];
  for(const p of Object.values(S.players)){
    p.age++;const d=p.age<=23?ri(1,4):p.age<=27?ri(0,2):p.age<=30?ri(-1,1):ri(-4,-1);
    for(const k in p.a)if(!(p.pos!=="POR"&&(k==="ref"||k==="col")))p.a[k]=clamp(p.a[k]+d+ri(-1,1),20,99);
    p.goals=0;p.apps=0;p.cards=0;p.energy=100;p.inj=0;p.morale=70;
  }
  S.fixtures=makeFixtures(Object.keys(S.teams),hash("s"+S.season+S.user));
  for(const id in S.teams)autoLineup(id);
  pushNews(`Comença la temporada ${S.season}-${(S.season+1)%100}. Els jugadors han envellit un any i han evolucionat.`,true);
  save();
}

/* ============ MERCAT ============ */
function isKey(p){const sq=squad(p.team).sort((a,b)=>ovr(b)-ovr(a));return sq.indexOf(p)<3}
function canLeave(p){const sq=squad(p.team);if(sq.length<=8)return "L'equip no té prou jugadors per vendre'l.";if(p.pos==="POR"&&sq.filter(x=>x.pos==="POR").length<=2)return "No vendran un dels seus dos porters.";return null}
function makeOffer(pid,amount){
  const p=S.players[pid],me=S.teams[S.user];
  if(squad(S.user).length>=12)return {ok:false,msg:"Tens 12 jugadors. Ven-ne algun abans de fitxar."};
  if(amount>me.budget)return {ok:false,msg:"No tens prou pressupost per aquesta oferta."};
  const no=canLeave(p);if(no)return {ok:false,msg:no};
  const v=valueOf(p)*(isKey(p)?1.35:1);
  const offerSal=salaryOf(ovr(p),p.age,S.user);
  if(offerSal<p.salary*.7)return {ok:false,msg:`${p.name} no vol venir: cobra ${eurMes(p)} i el teu club només li pot pagar uns ${(Math.round(offerSal*1000/10/10)*10).toLocaleString("ca-ES")} €/mes.`};
  const ratio=amount/v;const prob=ratio>=1.25?1:ratio>=1?.6+(ratio-1)*1.6:ratio>=.85?.15:0;
  if(R()<prob){
    const from=S.teams[p.team];from.budget+=amount;me.budget-=amount;
    p.team=S.user;p.salary=Math.max(p.salary*1.05,salaryOf(ovr(p),p.age,S.user));p.forSale=false;p.morale=80;
    autoLineup(from.id);
    pushNews(`FITXATGE: ${p.name} arriba del ${from.name} per ${money(amount)}.`,true);save();
    return {ok:true,msg:`${p.name} és nou jugador del ${me.name}!`};
  }
  return {ok:false,msg:ratio<.85?`El ${S.teams[p.team].name} ni s'ho planteja. Valoren ${p.name} en uns ${money(Math.round(v))}.`:`El ${S.teams[p.team].name} rebutja l'oferta. Potser amb una mica més…`};
}
function aiOffers(){
  for(const p of squad(S.user)){if(!p.forSale)continue;
    if(R()<.55){const buyers=Object.keys(S.teams).filter(t=>t!==S.user&&S.teams[t].budget>valueOf(p)*.8&&squad(t).length<12);
      if(!buyers.length)continue;const b=buyers[ri(0,buyers.length-1)];const amt=Math.max(1,Math.round(valueOf(p)*(.75+R()*.45)));
      if(!S.offers.some(o=>o.pid===p.id&&o.from===b)){S.offers.push({id:"o"+(S.nextId++),pid:p.id,from:b,amt});pushNews(`Oferta del ${S.teams[b].name} per ${p.name}: ${money(amt)}.`,true)}}}
}
function acceptOffer(oid){
  const o=S.offers.find(x=>x.id===oid);if(!o)return;const p=S.players[o.pid],b=S.teams[o.from],me=S.teams[S.user];
  if(squad(S.user).length<=8){toast("Necessites com a mínim 8 jugadors.");return}
  if(b.budget<o.amt){toast(`El ${b.name} ja no té diners.`);S.offers=S.offers.filter(x=>x.id!==oid);render();return}
  b.budget-=o.amt;me.budget+=o.amt;p.team=b.id;p.forSale=false;
  S.offers=S.offers.filter(x=>x.pid!==p.id);autoLineup(S.user);autoLineup(b.id);
  pushNews(`VENDA: ${p.name} marxa al ${b.name} per ${money(o.amt)}.`,true);save();toast(`${p.name} venut per ${money(o.amt)}`);render();
}

/* ============ UI COMPONENTS ============ */
/* Distintiu genèric (no és l'escut real): rodella amb els dos colors del club i l'abreviatura de la RFEP */
const ABBR={BAR:"BAR",IGU:"IHC",LIC:"HCL",REU:"REUS",CAL:"CPC",NOI:"NOIA",LLE:"LLEI",VOL:"VOL",CLD:"CHC",LLO:"LLO",ALC:"PAS",RIV:"RIV",VIL:"CPV",MAC:"SHUM"};
function lum(hex){const h=hex.replace("#","");const n=h.length===3?h.split("").map(c=>c+c).join(""):h;const [r,g,b]=[0,2,4].map(i=>parseInt(n.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b}
function shield(t,size=40){
  const ab=ABBR[t.id]||t.id,c1=t.c1,c2=t.c2,uid="sh"+t.id+size;
  const ink=lum(c1)>.45?"#10161f":"#ffffff";
  const fs=ab.length>=4?10.5:13;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true" style="flex:0 0 auto">
  <defs><clipPath id="${uid}"><circle cx="20" cy="20" r="17"/></clipPath></defs>
  <circle cx="20" cy="20" r="19.2" fill="${c2}"/>
  <g clip-path="url(#${uid})"><rect width="40" height="40" fill="${c1}"/><path d="M40 0V40H0z" fill="${c2}" opacity=".9"/><circle cx="20" cy="20" r="11.5" fill="${c1}"/></g>
  <circle cx="20" cy="20" r="19.2" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1"/>
  <text x="20" y="20" dy=".36em" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,Arial" font-weight="800" font-size="${fs}" fill="${ink}" letter-spacing=".2">${ab}</text></svg>`;
}
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const pos=p=>`<span class="pos ${p}">${p}</span>`;
const bar=(v,c)=>`<span class="bar" title="${v}%"><i style="width:${v}%;background:${c||(v>70?"var(--good)":v>45?"var(--warn)":"var(--bad)")}"></i></span>`;
function ovrCol(o){return o>=86?"var(--good)":o>=80?"var(--data)":o>=72?"var(--fg)":"var(--dim)"}
function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ============ PARTIT ANIMAT ============ */
let ticker=null;
function runMatchView(){
  const {m}=ui.match,r=m.res;const feed=$("#feed"),sc=$("#sc"),clk=$("#clk");if(!feed)return;
  let i=0,minute=0,h=0,a=0;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const show=e=>{if(e.t==="goal"){if(e.tid===m.h)h++;else a++}
    const li=document.createElement("li");li.className=e.t==="goal"?"goal":e.t==="blue"?"blue":"";
    li.innerHTML=`<span class="m">${e.m}'</span><span>${esc(evText(e,m))}</span>`;feed.prepend(li);sc.textContent=`${h}–${a}`};
  const finish=()=>{clearInterval(ticker);ticker=null;while(i<r.ev.length)show(r.ev[i++]);clk.textContent="FINAL";sc.textContent=`${r.gh}–${r.ga}`;
    const li=document.createElement("li");li.innerHTML=`<span class="m">50'</span><span><b>Final del partit.</b></span>`;feed.prepend(li);const sk=$("#bSkip");if(sk)sk.disabled=true};
  if(reduce){finish();return}
  ticker=setInterval(()=>{minute++;clk.textContent=minute===25?"DESCANS":minute+"'";while(i<r.ev.length&&r.ev[i].m<=minute)show(r.ev[i++]);if(minute>=50)finish()},140);
  $("#bSkip").onclick=finish;
}

function bind(){
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;ui.selSlot=null;if(ticker){clearInterval(ticker);ticker=null}render();window.scrollTo(0,0)});
  const bp=$("#bPlay");if(bp)bp.onclick=()=>{if(ticker){clearInterval(ticker);ticker=null}playRound();render();runMatchView()};
  const bn=$("#bNew");if(bn)bn.onclick=()=>{newSeason();view="inici";render()};
  const bb=$("#bBack");if(bb)bb.onclick=()=>{if(ticker){clearInterval(ticker);ticker=null}view="inici";render()};
  document.querySelectorAll("[data-pl]").forEach(r=>{r.onclick=()=>playerModal(r.dataset.pl);r.onkeydown=e=>{if(e.key==="Enter")playerModal(r.dataset.pl)}});
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;ui.selSlot=ui.selSlot===i?null:i;render()});
  document.querySelectorAll("[data-bench]").forEach(r=>{const go=()=>{
    if(ui.selSlot==null){toast("Primer tria una posició a la pista");return}
    const p=S.players[r.dataset.bench];if(!avail(p)){toast(`${p.name} està lesionat`);return}
    if(ui.selSlot===0&&p.pos!=="POR"){toast("A la porteria hi ha d'anar un porter");return}
    if(ui.selSlot>0&&p.pos==="POR"){toast("Un porter no pot jugar de jugador de pista");return}
    S.teams[S.user].lineup[ui.selSlot]=p.id;ui.selSlot=null;save();render()};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter")go()}});
  const ts=$("#tStyle");if(ts)ts.onchange=()=>{S.teams[S.user].tactic.style=ts.value;save()};
  const tp=$("#tPress");if(tp)tp.onchange=()=>{S.teams[S.user].tactic.press=tp.value;save()};
  const ba=$("#bAuto");if(ba)ba.onclick=()=>{autoLineup(S.user);save();render()};
  const mq=$("#mQ");if(mq)mq.oninput=()=>{ui.mQ=mq.value;const pos=mq.selectionStart;render();const n=$("#mQ");n.focus();n.setSelectionRange(pos,pos)};

/* Punts per partit */
function fpPoints(pos,s){
  if(!s||!s.pl)return 0;
  let p=1+(s.st?1:0);
  p+=(s.g||0)*(pos==="POR"?6:pos==="DEF"?4:3)+(s.a||0)*2-(s.bl||0)-(s.rd||0)*3;
  p+=s.res==="W"?2:s.res==="D"?1:0;
  if(pos==="POR"&&s.st){const ga=s.ga||0;p+=ga===0?4:ga<=2?2:ga<=4?0:-2}
  return p;
}

/* ---- Simulació determinista (mode simulat): mateix resultat per a tots els membres de la lliga ---- */
const SIMC={};
function pickR(arr,w,r){const s=w.reduce((a,b)=>a+b,0);let x=r()*s;for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i]}return arr[arr.length-1]}
function simSide(tid,r){
  const sq=FPL.filter(p=>p.team===tid);const gks=sq.filter(p=>p.pos==="POR").sort((a,b)=>b.r-a.r);const fld=sq.filter(p=>p.pos!=="POR").sort((a,b)=>b.r-a.r);
  const gk=(r()<.85||gks.length<2)?gks[0]:gks[1];
  const st=fld.slice(0,4);for(let i=0;i<4;i++)if(fld.length>4+i%2&&r()<.15)st[i]=fld[4+(i%2)];
  const starters=[...new Set(st)];const rest=fld.filter(p=>!starters.includes(p));const subs=rest.slice(0,2+(r()<.5?1:0));
  const f=starters;const avg=f.reduce((s,p)=>s+p.r,0)/f.length;
  const nDav=f.filter(p=>p.pos==="DAV").length;
  return {gk,starters:[gk,...starters],played:[gk,...starters,...subs],field:[...starters,...subs],att:avg+(nDav-2)*.6,def:avg-(nDav-2)*.6,gkr:gk?gk.r:65};
}
function simJornada(code,j){
  const r=rng(hash(code+"|"+j));const players={},matches=[];
  const pois=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=r()}while(p>L);return k-1};
  const lam=(x,xa,y)=>clamp(2.6*Math.pow(xa/(y.def*.55+y.gkr*.45),4.2),.3,8);
  for(const [h,a] of CAL[j]){
    const H=simSide(h,r),A=simSide(a,r);const gh=pois(lam(H,H.att*1.035,A)),ga=pois(lam(A,A.att,H));
    for(const [S,gf,gc] of [[H,gh,ga],[A,ga,gh]]){
      const res=gf>gc?"W":gf===gc?"D":"L";
      for(const p of S.played)players[p.id]={pl:1,st:S.starters.includes(p)?1:0,g:0,a:0,bl:0,rd:0,res,ga:p===S.gk?gc:0};
      for(let i=0;i<gf;i++){
        const sc=pickR(S.field,S.field.map(p=>Math.pow(p.r,3)*(p.pos==="DAV"?1.6:1)*(S.starters.includes(p)?1:.45)),r);players[sc.id].g++;
        if(r()<.62){const o=S.field.filter(p=>p!==sc);if(o.length){const as=pickR(o,o.map(p=>p.r*p.r),r);players[as.id].a++}}
      }
      const nb=pois(.9);for(let i=0;i<nb;i++){const p=S.field[Math.floor(r()*S.field.length)];players[p.id].bl++}
      if(r()<.03){const p=S.field[Math.floor(r()*S.field.length)];players[p.id].rd++}
    }
    matches.push([h,a,gh,ga]);
  }
  return {players,matches};
}
function simUpTo(code,n){let c=SIMC[code];if(!c)c=SIMC[code]={done:0,res:{}};for(let j=c.done+1;j<=n;j++){c.res[j]=simJornada(code,j);c.done=j}return c.res}

function deadline(j){const ms=calJ(j);if(!ms.length)return null;return ms.map(m=>new Date(tz(m[2])).getTime()).sort((a,b)=>a-b)[0]}
function closedJ(L){if(!L)return 0;if(L.mode==="sim")return L.simRound||0;let c=0;for(const k in F.pts){const d=F.pts[k];if(d&&d.closed&&d.j>c)c=d.j}return c}

function statsFor(L,j){if(!L)return null;if(L.mode==="sim"){if(j>(L.simRound||0))return null;return simUpTo(L.code,j)[j].players}const d=F.pts["j"+j];return d&&d.closed?d.players:null}

function lineupFor(rec,j){if(!rec||!rec.lineups)return null;for(let k=j;k>=1;k--)if(rec.lineups[k])return rec.lineups[k];return null}
function teamPoints(rec,L,j){const lu=lineupFor(rec,j),st=statsFor(L,j);if(!lu||!st)return null;let t=0;for(const pid of lu.xi||[]){const p=FPM[pid];if(!p)continue;let v=fpPoints(p.pos,st[pid]);if(pid===lu.cap)v*=2;t+=v}return t}

function priceTable(L){const c=closedJ(L);const out={};for(const p of FPL){let pr=basePrice(p.r),tot=0,last=null;
  for(let j=1;j<=c;j++){const st=statsFor(L,j);const v=st?fpPoints(p.pos,st[p.id]):0;tot+=v;last=v;pr*=1+clamp((v-5)*.01,-.05,.05)}
  const b0=basePrice(p.r);pr=clamp(pr,b0*.5,b0*2.2);out[p.id]={price:Math.max(.2,Math.round(pr*10)/10),base:basePrice(p.r),tot,last}}return out}

function fbAdapter(fs){
  const wrap=s=>({id:s.id,exists:s.exists,data:()=>s.data()});
  const ref=r=>({get:async()=>wrap(await r.get()),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrap(s)),e)});
  const q=x=>({where:(f,o,v)=>q(x.where(f,o,v)),onSnapshot:(n,e)=>x.onSnapshot(qs=>n({docs:qs.docs.map(wrap)}),e),get:async()=>({docs:(await x.get()).docs.map(wrap)})});
  return {doc:path=>ref(fs.doc(path)),collection:path=>q(fs.collection(path))};
}

  F.db.collection("pts").onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data()});F.pts=o;render()},()=>{});
  F.db.doc("config/season").onSnapshot(s=>{F.cfg=s.exists?s.data():null;render()},()=>{});
}
function subLeagues(){for(const c of (F.me&&F.me.codes)||[])if(!F.lsub[c]){F.lsub[c]=1;F.db.doc("leagues/"+c).onSnapshot(s=>{if(s.exists)F.leagues[c]=s.data();else delete F.leagues[c];render()},()=>{})}}
function subBoard(code){if(F.bsub[code])return;F.bsub[code]=1;F.db.collection("teams").where("codes","array-contains",code).onSnapshot(q=>{F.board[code]=q.docs.map(d=>({uid:d.id,mgr:d.data().mgr||"",rec:(d.data().leagues||{})[code]})).filter(x=>x.rec);render();resolveNames(F.board[code].map(x=>x.uid))},()=>{})}
async function resolveNames(ids){if(F.backend==="firebase"){for(const x of F.board[F.code]||[])F.names[x.uid]=x.mgr||"";render();return}if(!F.user||!ids.length)return;try{const ps=await F.user.profiles(ids);for(const id of ids)F.names[id]=(ps[id]&&ps[id].name)||"";render()}catch(e){}}
const ERRMSG={"permission-denied":"No tens permís per fer aquest canvi.",invalid_argument:"No tens permís per desar dades en aquesta lliga. Demana al propietari que et convidi com a editor.",quota_exceeded:"La base de dades és plena.",resource_exhausted:"Massa canvis seguits. Espera uns segons.",unavailable:"Connexió inestable. Torna-ho a provar."};

function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const b=new Uint32Array(6);crypto.getRandomValues(b);for(const x of b)s+=A[x%A.length];return s}
async function joinLeague(code,teamName){
  code=code.trim().toUpperCase();const ls=await F.db.doc("leagues/"+code).get();
  if(!ls.exists){toast("No existeix cap lliga amb aquest codi.");return false}

  else{if((F.me.codes||[]).includes(code)){toast("Ja ets en aquesta lliga.");return true}await ref.update({codes:[...(F.me.codes||[]),code],leagues:{[code]:rec},...extra})}

function updRec(patch){return F.db.doc("teams/"+F.uid).update({leagues:{[F.code]:patch}})}

/* ---- Mercat ---- */
function canBuy(rec,p,prices){
  if(rec.squad.includes(p.id))return "Ja el tens.";
  if(rec.squad.length>=FANT.squad)return `La plantilla ja té ${FANT.squad} jugadors. Ven-ne un primer.`;
  const gks=rec.squad.filter(id=>FPM[id]&&FPM[id].pos==="POR").length,fld=rec.squad.length-gks;
  if(p.pos==="POR"&&gks>=FANT.gk)return "Ja tens 2 porters.";
  if(p.pos!=="POR"&&fld>=FANT.squad-FANT.gk)return "Ja tens 6 jugadors de pista.";
  if(rec.squad.filter(id=>FPM[id]&&FPM[id].team===p.team).length>=FANT.maxClub)return `Màxim ${FANT.maxClub} jugadors del mateix club.`;
  if(prices[p.id].price>rec.bank+1e-9)return "No tens prou pressupost.";
  return null;
}
async function buy(pid){const rec=myRec(),L=lg(),pr=priceTable(L),p=FPM[pid];const no=canBuy(rec,p,pr);if(no){toast(no);return}
  await fWrite(()=>updRec({squad:[...rec.squad,pid],bank:Math.round((rec.bank-pr[pid].price)*10)/10}),`${p.name} fitxat per ${fmtM(pr[pid].price)}`)}
async function sell(pid){const rec=myRec(),L=lg(),pr=priceTable(L),p=FPM[pid];const j=openJ(L);
  const patch={squad:rec.squad.filter(x=>x!==pid),bank:Math.round((rec.bank+pr[pid].price)*10)/10};
  const lu=rec.lineups&&rec.lineups[j];if(lu&&!isLocked(L,j)&&lu.xi.includes(pid))patch.lineups={[j]:{xi:lu.xi.filter(x=>x!==pid),cap:lu.cap===pid?null:lu.cap}};
  await fWrite(()=>updRec(patch),`${p.name} venut per ${fmtM(pr[pid].price)}`)}

/* ---- Alineació ---- */
function autoXI(squad){const ps=squad.map(id=>FPM[id]).filter(Boolean);const gk=ps.filter(p=>p.pos==="POR").sort((a,b)=>b.r-a.r)[0];const f=ps.filter(p=>p.pos!=="POR").sort((a,b)=>b.r-a.r).slice(0,4);
  const xi=[gk?gk.id:null,...f.map(p=>p.id)];while(xi.length<5)xi.push(null);return {xi,cap:f[0]?f[0].id:null}}
function draftFor(rec,L){const j=openJ(L);if(F.draft&&F.draft.code===F.code&&F.draft.j===j)return F.draft;
  const base=lineupFor(rec,j);let xi=base?base.xi.slice():autoXI(rec.squad).xi,cap=base?base.cap:autoXI(rec.squad).cap;
  xi=xi.map((id,i)=>id&&rec.squad.includes(id)&&((i===0)===(FPM[id].pos==="POR"))?id:null);while(xi.length<5)xi.push(null);
  F.draft={code:F.code,j,xi,cap:xi.includes(cap)?cap:null,dirty:!base||!(rec.lineups&&rec.lineups[j])};return F.draft}

  if(st){
    const rows=(lu?lu.xi:[]).map(id=>FPM[id]).filter(Boolean).map(p=>{const s=st[p.id];let v=fpPoints(p.pos,s);const cap=lu.cap===p.id;if(cap)v*=2;
      return `<tr><td>${pos(p.pos)}</td><td>${cap?"Ⓒ ":""}${esc(p.name)}</td><td>${esc(ABBR[p.team])}</td><td class="muted">${s&&s.pl?`${s.st?"Titular":"Suplent"}${s.g?` · ${s.g} gol${s.g>1?"s":""}`:""}${s.a?` · ${s.a} assist.`:""}${s.bl?` · ${s.bl} blava`:""}${s.rd?" · vermella":""}${p.pos==="POR"&&s.st?` · ${s.ga} encaixats`:""}`:"No ha jugat"}</td><td class="r"><b>${v}</b></td></tr>`}).join("");
    detail=`<h3>El meu equip</h3>${lu?`<div class="scroll"><table><tbody>${rows}<tr><td colspan="4"><b>Total</b></td><td class="r"><b class="acc">${teamPoints(rec,L,jv)}</b></td></tr></tbody></table></div>`:`<p class="muted" style="margin:0">No tenies alineació per a aquesta jornada.</p>`}
     ${ms?`<h3>Resultats</h3><table><tbody>${ms.map(([h,a,gh,ga])=>`<tr><td style="white-space:normal">${esc(TM[h]?TM[h].name:h)}</td><td class="r num" style="width:60px"><b>${gh}–${ga}</b></td><td style="white-space:normal">${esc(TM[a]?TM[a].name:a)}</td></tr>`).join("")}</tbody></table>`:""}`;
  }
  const next=calJ(j);
  return `<div class="grid2" style="align-items:start"><section class="bevel panel"><div class="row" style="justify-content:space-between"><h2>Jornades</h2>${c?sel:""}</div>${simCtl}${detail}</section>
  <section class="bevel panel"><h2>Propera: J${j}</h2><table><tbody>${next.map(([h,a,d])=>`<tr><td style="white-space:normal">${esc(TM[h].name)}</td><td class="muted" style="width:90px">${L.mode==="sim"?"":esc(d.slice(8,10)+"/"+d.slice(5,7)+" "+d.slice(11))}</td><td style="white-space:normal">${esc(TM[a].name)}</td></tr>`).join("")}</tbody></table></section></div>`;
}
function fRulesTab(){return `<section class="bevel panel" style="max-width:760px"><h2>Normes</h2>
  <p style="margin:0">Cada mànager té <b>${FANT.budget} M</b> per fer una plantilla de <b>${FANT.squad} jugadors</b> (2 porters i 6 de pista), amb un màxim de ${FANT.maxClub} jugadors del mateix club. Cada jornada alineeu un porter i quatre jugadors de pista, i trieu un capità.</p>
  <p style="margin:0">Els preus parteixen de la mitjana de cada jugador i pugen o baixen segons els punts que fa. Vens al preu del moment.</p>
  <h3>Punts per partit</h3><table><tbody>${RULES.map(([a,b])=>`<tr><td>${a}</td><td class="r"><b>${b}</b></td></tr>`).join("")}</tbody></table>
  <p class="muted" style="margin:0">Si no deses alineació per a una jornada, es fa servir l'última que hagis desat. En les lligues de partits reals, l'alineació es tanca quan comença el primer partit de la jornada.</p></section>`}

function bindF(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  on("#fLogin","click",async()=>{try{await F.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){if(e&&e.code!=="auth/popup-closed-by-user")toast("No s'ha pogut iniciar la sessió.")}});
  on("#fLogout","click",async()=>{await F.auth.signOut();F.me=null;F.code=null;F.leagues={};F.lsub={};F.board={};F.bsub={};render()});
  on("#fMenu","click",()=>{MODE=null;startStep="menu";render();window.scrollTo(0,0)});
  on("[data-fl]","click",e=>{const c=e.currentTarget.dataset.fl;F.code=c||null;F.tab="equip";F.sel=null;F.draft=null;render();window.scrollTo(0,0)});
  on("[data-ft]","click",e=>{F.tab=e.currentTarget.dataset.ft;F.sel=null;render()});
  on("#fCopy","click",async()=>{try{await navigator.clipboard.writeText(lg().code);toast("Codi copiat")}catch(e){toast("Selecciona el codi i copia'l")}});
  on("#fcGo","click",()=>{const n=$("#fcName").value.trim(),t=$("#fcTeam").value.trim(),m=(document.querySelector('input[name="fcMode"]:checked')||{}).value||"real";
    fWrite(()=>createLeague(n,m,t),"Lliga creada. Ara fes la plantilla.")});
  on("#fjGo","click",()=>{const c=$("#fjCode").value.trim(),t=$("#fjTeam").value.trim();if(c.length<4){toast("Escriu el codi de la lliga.");return}fWrite(()=>joinLeague(c,t))});
  on("[data-fbuy]","click",e=>buy(e.currentTarget.dataset.fbuy));
  on("[data-fsell]","click",e=>sell(e.currentTarget.dataset.fsell));
  const mq=$("#fmQ");if(mq)mq.oninput=()=>{F.mQ=mq.value;const p=mq.selectionStart;render();const n=$("#fmQ");n.focus();n.setSelectionRange(p,p)};
  on("#fmPos","change",e=>{F.mPos=e.currentTarget.value;render()});
  on("#fmTeam","change",e=>{F.mTeam=e.currentTarget.value;render()});
  on("[data-fs]","click",e=>{const i=+e.currentTarget.dataset.fs;F.sel=F.sel===i?null:i;render()});
  const benchPick=id=>{const L=lg(),rec=myRec(),dr=draftFor(rec,L);if(F.sel==null){toast("Primer toca una posició de la pista");return}
    const p=FPM[id];if(F.sel===0&&p.pos!=="POR"){toast("A la porteria hi ha d'anar un porter");return}if(F.sel>0&&p.pos==="POR"){toast("Un porter no pot jugar de jugador de pista");return}
    const out=dr.xi[F.sel];dr.xi[F.sel]=id;if(dr.cap===out)dr.cap=null;if(!dr.cap&&F.sel>0)dr.cap=id;dr.dirty=true;F.sel=null;render()};
  on("[data-fb]","click",e=>benchPick(e.currentTarget.dataset.fb));
  on("[data-fb]","keydown",e=>{if(e.key==="Enter")benchPick(e.currentTarget.dataset.fb)});
  on("[data-fc]","click",e=>{const dr=draftFor(myRec(),lg());dr.cap=e.currentTarget.dataset.fc;dr.dirty=true;render()});
  on("#fAuto","click",()=>{const dr=draftFor(myRec(),lg());const a=autoXI(myRec().squad);dr.xi=a.xi;dr.cap=a.cap;dr.dirty=true;render()});
  on("#fSave","click",()=>{const L=lg(),dr=draftFor(myRec(),L);if(isLocked(L,dr.j)){toast("La jornada ja ha començat");return}
    fWrite(async()=>{await updRec({lineups:{[dr.j]:{xi:dr.xi,cap:dr.cap}}});dr.dirty=false},"Alineació desada")});
  on("#fjSel","change",e=>{F.jView=+e.currentTarget.value;render()});
  on("#fSim","click",()=>{const L=lg();fWrite(()=>F.db.doc("leagues/"+L.code).update({simRound:(L.simRound||0)+1}),`Jornada ${(L.simRound||0)+1} simulada`)});
  on("#fLeave","click",()=>{$("#fLeaveC").hidden=false});
  on("#fLeaveN","click",()=>{$("#fLeaveC").hidden=true});
  on("#fLeaveY","click",()=>{const c=F.code;fWrite(()=>leaveLeague(c),"Has sortit de la lliga")});
}

function start(data){if(data&&data.S){S=data.S;view=data.view||"inici"}render()}
window.claude?.hot?.snapshot?.(()=>({S,view:view==="partit"?"inici":view}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
